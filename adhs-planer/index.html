<title>Eins nach dem Anderen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: eine schmale Spalte wie ein einzelnes System-Fenster, pro Ansicht genau eine Hauptaktion, Tab-Leiste unten (Daumen-Reichweite).
   Designs (System, Nacht, Wald, Hell, Rosé), Akzentfarbe, Schrift und Größe kommen aus den Einstellungen und setzen nur Tokens um. */
:root {
  --bg: #050b1c;
  --bg-glow-1: rgba(46, 104, 196, .34);
  --bg-glow-2: rgba(30, 70, 150, .2);
  --panel: #0a1736;
  --panel-2: #0e2149;
  --panel-3: #143066;
  --panel-a: rgba(16, 36, 80, .94);
  --panel-b: rgba(7, 17, 40, .96);
  --surface: rgba(14, 33, 73, .8);
  --field: rgba(5, 11, 28, .65);
  --bar: rgba(7, 17, 40, .96);
  --sep: rgba(43, 108, 156, .45);
  --inner: rgba(43, 108, 156, .55);
  --line: #4fd8ff;
  --line-dim: #2b6c9c;
  --on-accent: #07101e;
  --ink: #ecf8ff;
  --ink-dim: #9ec4e2;
  --ink-faint: #6f93b3;
  --danger: #ff7a98;
  --gold: #ffd57e;
  --gold-bg: rgba(255, 213, 126, .07);
  --gold-line: rgba(255, 213, 126, .45);
  --scrim: rgba(0, 0, 0, .4);
  --tint: color-mix(in srgb, var(--line) 12%, transparent);
  --accent-hover: color-mix(in srgb, var(--line) 78%, white);
  --glow-strong: color-mix(in srgb, var(--line) 70%, transparent);
  --glow-soft: color-mix(in srgb, var(--line) 30%, transparent);
  --glow-faint: color-mix(in srgb, var(--line) 12%, transparent);
  --text-glow: 0 0 6px color-mix(in srgb, var(--line) 60%, transparent), 0 0 14px color-mix(in srgb, var(--line) 30%, transparent);

  --f-display: "Cinzel", "Trajan Pro", "Times New Roman", Georgia, serif;
  --f-body: "Crimson Pro", Georgia, "Times New Roman", serif;
  --fs-body: 1.125rem;
  --w-display: 700;
  --track: .08em;

  --fs-xs: .8rem;
  --fs-s: .95rem;
  --fs-m: 1.1rem;
  --fs-l: 1.4rem;
  --fs-xl: 2rem;
  --fs-xxl: clamp(2rem, 8vw, 2.7rem);

  color-scheme: dark;
}
:root[data-look="nacht"] {
  --bg: #0e1015;
  --bg-glow-1: rgba(120, 110, 200, .12);
  --bg-glow-2: rgba(120, 110, 200, .06);
  --panel: #171a21;
  --panel-2: #1d2129;
  --panel-3: #272c37;
  --panel-a: #1a1d25;
  --panel-b: #15181e;
  --surface: #1a1d25;
  --field: #111318;
  --bar: rgba(17, 19, 24, .97);
  --sep: #2a2f3a;
  --inner: transparent;
  --line-dim: #3d4453;
  --ink: #e8eaf0;
  --ink-dim: #aab0be;
  --ink-faint: #7e8596;
  --glow-strong: color-mix(in srgb, var(--line) 35%, transparent);
  --glow-soft: color-mix(in srgb, var(--line) 15%, transparent);
  --glow-faint: transparent;
  --text-glow: none;
}
:root[data-look="wald"] {
  --bg: #08130e;
  --bg-glow-1: rgba(40, 140, 90, .25);
  --bg-glow-2: rgba(30, 110, 70, .15);
  --panel: #0e1d16;
  --panel-2: #13271e;
  --panel-3: #1b3529;
  --panel-a: rgba(18, 40, 30, .94);
  --panel-b: rgba(9, 22, 16, .96);
  --surface: rgba(19, 39, 30, .8);
  --field: rgba(5, 14, 10, .65);
  --bar: rgba(9, 22, 16, .96);
  --sep: rgba(47, 110, 80, .45);
  --inner: rgba(47, 110, 80, .55);
  --line-dim: #2f6e50;
  --ink: #eaf6ef;
  --ink-dim: #a6cdb7;
  --ink-faint: #7aa18b;
}
:root[data-look="hell"] {
  --bg: #eef2f7;
  --bg-glow-1: rgba(120, 160, 220, .2);
  --bg-glow-2: rgba(120, 160, 220, .1);
  --panel: #ffffff;
  --panel-2: #f2f5fa;
  --panel-3: #e3e9f2;
  --panel-a: #ffffff;
  --panel-b: #f9fbfd;
  --surface: #ffffff;
  --field: #ffffff;
  --bar: rgba(255, 255, 255, .97);
  --sep: #dde3ec;
  --inner: transparent;
  --line-dim: #b9c4d4;
  --ink: #152033;
  --ink-dim: #46536a;
  --ink-faint: #677288;
  --danger: #c42a4f;
  --gold: #8a5a06;
  --gold-bg: rgba(214, 150, 30, .08);
  --gold-line: rgba(180, 120, 20, .45);
  --scrim: rgba(20, 30, 50, .18);
  --accent-hover: color-mix(in srgb, var(--line) 85%, black);
  --glow-strong: color-mix(in srgb, var(--line) 30%, transparent);
  --glow-soft: color-mix(in srgb, var(--line) 16%, transparent);
  --glow-faint: color-mix(in srgb, var(--line) 6%, transparent);
  --text-glow: none;
  color-scheme: light;
}
:root[data-look="rose"] {
  --bg: #f7eef1;
  --bg-glow-1: rgba(220, 140, 170, .2);
  --bg-glow-2: rgba(220, 140, 170, .1);
  --panel: #fffafb;
  --panel-2: #fbf0f3;
  --panel-3: #f3dfe6;
  --panel-a: #fffafb;
  --panel-b: #fdf4f6;
  --surface: #fffafb;
  --field: #ffffff;
  --bar: rgba(255, 250, 251, .97);
  --sep: #eed8df;
  --inner: transparent;
  --line-dim: #dcb6c3;
  --ink: #33202a;
  --ink-dim: #674856;
  --ink-faint: #876874;
  --danger: #b8233f;
  --gold: #8a5206;
  --gold-bg: rgba(214, 150, 30, .08);
  --gold-line: rgba(180, 120, 20, .45);
  --scrim: rgba(60, 20, 40, .16);
  --accent-hover: color-mix(in srgb, var(--line) 85%, black);
  --glow-strong: color-mix(in srgb, var(--line) 30%, transparent);
  --glow-soft: color-mix(in srgb, var(--line) 16%, transparent);
  --glow-faint: color-mix(in srgb, var(--line) 6%, transparent);
  --text-glow: none;
  color-scheme: light;
}
:root[data-glow="off"] {
  --glow-strong: transparent;
  --glow-soft: transparent;
  --glow-faint: transparent;
  --text-glow: none;
}
:root[data-font="klar"] {
  --f-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --fs-body: 1rem;
  --w-display: 600;
  --track: .01em;
}
:root[data-font="freundlich"] {
  --f-display: "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --fs-body: 1.0625rem;
  --w-display: 800;
  --track: .01em;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  padding-inline: 16px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--fs-body);
  line-height: 1.45;
  background:
    radial-gradient(120% 60% at 50% -10%, var(--bg-glow-1), transparent 62%),
    radial-gradient(70% 45% at 100% 100%, var(--bg-glow-2), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
p, h1, h2, h3, ul, ol { margin: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.app {
  max-width: 36rem;
  margin-inline: auto;
  padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---------- Kopfzeile ---------- */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.top-l { display: grid; gap: 2px; min-width: 0; }
.top-r { display: flex; align-items: center; gap: 8px; }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--f-display);
  font-size: var(--fs-xs);
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.eyebrow .ico { width: 15px; height: 15px; }
.brand {
  font-family: var(--f-display);
  font-weight: var(--w-display);
  font-size: var(--fs-l);
  letter-spacing: calc(var(--track) + .04em);
  line-height: 1.15;
  text-shadow: var(--text-glow);
}
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-s); color: var(--ink-faint); }
.sync::before { content: ""; width: 7px; height: 7px; transform: rotate(45deg); background: var(--ink-faint); }
.sync[data-s="cloud"]::before { background: var(--line); box-shadow: 0 0 6px var(--glow-strong); }
.sync[data-s="saving"]::before { background: var(--gold); }

/* ---------- Grundbausteine ---------- */
.stack { display: flex; flex-direction: column; gap: 22px; }
.block { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.view-head { display: grid; gap: 6px; }
.h-view {
  font-family: var(--f-display);
  font-weight: var(--w-display);
  font-size: var(--fs-xl);
  letter-spacing: var(--track);
  line-height: 1.15;
  text-shadow: var(--text-glow);
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.h-sec {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: var(--fs-m);
  letter-spacing: var(--track);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.sub { color: var(--ink-dim); max-width: 46ch; }
.hint { color: var(--ink-faint); font-size: var(--fs-s); }
.lbl {
  font-family: var(--f-display);
  font-size: var(--fs-xs);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.panel {
  position: relative;
  background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 0 10px var(--glow-soft), 0 0 28px var(--glow-faint), inset 0 0 20px var(--glow-faint);
  padding: 22px 18px 20px;
}
.panel::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid var(--inner);
  border-radius: 4px;
  pointer-events: none;
}
.panel > * { position: relative; z-index: 1; }
.panel-quiet { border-color: var(--sep); box-shadow: none; }
.corners::before {
  --c: var(--line);
  --l: 18px;
  --t: 3px;
  content: "";
  position: absolute;
  inset: -3px;
  pointer-events: none;
  background:
    linear-gradient(var(--c) 0 0) left top / var(--l) var(--t),
    linear-gradient(var(--c) 0 0) left top / var(--t) var(--l),
    linear-gradient(var(--c) 0 0) right top / var(--l) var(--t),
    linear-gradient(var(--c) 0 0) right top / var(--t) var(--l),
    linear-gradient(var(--c) 0 0) left bottom / var(--l) var(--t),
    linear-gradient(var(--c) 0 0) left bottom / var(--t) var(--l),
    linear-gradient(var(--c) 0 0) right bottom / var(--l) var(--t),
    linear-gradient(var(--c) 0 0) right bottom / var(--t) var(--l);
  background-repeat: no-repeat;
  filter: drop-shadow(0 0 4px var(--glow-strong));
}
:root[data-look="nacht"] .corners::before,
:root[data-look="hell"] .corners::before,
:root[data-look="rose"] .corners::before { display: none; }

mark {
  background: none;
  color: var(--ink);
  text-shadow: var(--text-glow);
  border-bottom: 2px solid var(--line);
  padding-bottom: 1px;
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 8px 18px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: var(--fs-s);
  letter-spacing: var(--track);
  text-decoration: none;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: 0 0 8px var(--glow-soft), inset 0 0 0 3px var(--panel-2), inset 0 0 0 4px var(--glow-faint);
  transition: box-shadow .15s ease, background-color .15s ease, transform .08s ease;
}
.btn:hover { background: var(--panel-3); box-shadow: 0 0 14px var(--glow-strong), inset 0 0 0 3px var(--panel-3), inset 0 0 0 4px var(--glow-soft); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: default; }
.btn .ico { width: 18px; height: 18px; }
.btn-solid { background: var(--line); color: var(--on-accent); border-color: var(--line); box-shadow: 0 0 16px var(--glow-strong); }
.btn-solid:hover { background: var(--accent-hover); box-shadow: 0 0 22px var(--glow-strong); }
.btn-big { min-height: 58px; font-size: var(--fs-m); }
.btn-sm { min-height: 38px; padding: 6px 14px; font-size: var(--fs-xs); }
.btn-quiet { background: transparent; border-color: var(--line-dim); box-shadow: none; color: var(--ink-dim); }
.btn-quiet:hover { color: var(--ink); background: var(--tint); box-shadow: none; }
.btn-danger { border-color: var(--danger); color: var(--danger); background: transparent; box-shadow: none; }
.btn-danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); box-shadow: none; }
.icon-btn {
  width: 40px;
  height: 40px;
  flex: none;
  display: inline-grid;
  place-items: center;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  color: var(--ink-dim);
}
.icon-btn:hover { border-color: var(--line-dim); color: var(--ink); background: var(--tint); }
.icon-btn:disabled { opacity: .25; cursor: default; background: transparent; border-color: transparent; }
.icon-btn .ico { width: 20px; height: 20px; }
.icon-btn[aria-current="page"] { color: var(--ink); border-color: var(--line-dim); background: var(--tint); }
.link {
  align-self: flex-start;
  padding: 4px 0;
  background: none;
  border: 0;
  color: var(--ink-dim);
  font-size: var(--fs-s);
  text-decoration: underline;
  text-decoration-color: var(--line-dim);
  text-underline-offset: 4px;
}
.link:hover { color: var(--ink); text-decoration-color: var(--line); }
.ico { width: 22px; height: 22px; flex: none; }

/* ---------- Eingaben ---------- */
.field { display: flex; flex-wrap: wrap; gap: 8px; }
.field > .input { flex: 1 1 180px; }
.input {
  min-width: 0;
  min-height: 46px;
  padding: 10px 14px;
  background: var(--field);
  border: 1px solid var(--line-dim);
  border-radius: 4px;
  color: var(--ink);
  line-height: 1.35;
}
.input::placeholder { color: var(--ink-faint); opacity: 1; }
.input:focus { outline: none; border-color: var(--line); box-shadow: 0 0 10px var(--glow-soft); }
.input-sm { min-height: 38px; padding: 6px 10px; font-size: var(--fs-s); }
textarea.input { resize: none; overflow: hidden; display: block; }
select.input { padding-right: 8px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.edit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }

/* ---------- Jetzt ---------- */
.focus { display: flex; flex-direction: column; gap: 20px; }
.focus-head { display: grid; gap: 8px; }
.now-title { font-size: var(--fs-xxl); }
.when { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-dim); font-family: var(--f-display); font-size: var(--fs-s); letter-spacing: .06em; }
.when .ico { width: 16px; height: 16px; }
.savepoint {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--gold-bg);
  border: 1px solid var(--gold-line);
  border-radius: 4px;
}
.savepoint .lbl { color: var(--gold); }
.savepoint-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.next {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
  padding-top: 16px;
  border-top: 1px dashed var(--line-dim);
}
.step-big { font-size: var(--fs-l); line-height: 1.35; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn-big { flex: 1 1 200px; }
.park { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--gold-line); border-radius: 4px; background: var(--gold-bg); }
.park .lbl { color: var(--gold); }

/* Timer (60-Minuten-Scheibe) */
.timer {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 14px 20px;
  align-items: center;
  padding-top: 16px;
  border-top: 1px dashed var(--line-dim);
}
.dial { width: 150px; height: 150px; max-width: 100%; }
.dial svg { width: 100%; height: 100%; display: block; overflow: visible; }
.dial .face { fill: var(--panel); stroke: var(--line-dim); stroke-width: 1; }
.dial .wedge { fill: var(--line); fill-opacity: .85; filter: drop-shadow(0 0 4px var(--glow-strong)); }
.dial.low .wedge { fill: var(--danger); }
.dial .tick { stroke: var(--ink-dim); stroke-width: 1.2; stroke-linecap: round; }
.dial .tick.major { stroke: var(--ink); stroke-width: 1.8; }
.dial .hub { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.dial .num { fill: var(--ink-dim); font-family: var(--f-display); font-size: 7.5px; font-weight: 600; }
.t-side { display: grid; gap: 10px; min-width: 0; }
.t-read {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 2.3rem;
  line-height: 1;
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
  text-shadow: var(--text-glow);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 36px;
  padding: 4px 12px;
  background: transparent;
  border: 1px solid var(--line-dim);
  border-radius: 3px;
  color: var(--ink-dim);
  font-family: var(--f-display);
  font-size: var(--fs-xs);
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
}
.chip:hover { color: var(--ink); border-color: var(--line); }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--ink-dim); border-color: var(--ink-dim); }
@media (max-width: 440px) {
  .timer { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .t-side { justify-items: center; }
  .chips { justify-content: center; }
}

/* Abschluss-Meldung */
.win { display: grid; gap: 6px; text-align: center; justify-items: center; padding-block: 22px; }
.win-title {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: var(--fs-l);
  letter-spacing: .12em;
  text-transform: uppercase;
  text-shadow: var(--text-glow);
  animation: flicker 1.2s ease-out 1;
}
.win-task { font-size: var(--fs-m); overflow-wrap: anywhere; }
.win-msg { color: var(--ink-dim); }
.diamond { width: 16px; height: 16px; transform: rotate(45deg); background: var(--line); box-shadow: 0 0 12px var(--glow-strong); margin-bottom: 6px; }
.tally { color: var(--ink-dim); font-size: var(--fs-s); }
.tally strong { font-family: var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- Schritte / Häkchen ---------- */
.steps { list-style: none; padding: 0; display: flex; flex-direction: column; }
.step { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--sep); }
.step:last-child { border-bottom: 0; }
.step-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.step.is-done .step-text { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line-dim); }
.check { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; background: transparent; border: 0; }
.check .box {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--line);
  transform: rotate(45deg);
  box-shadow: 0 0 6px var(--glow-soft);
  transition: background-color .15s ease;
}
.check .box .ico { width: 13px; height: 13px; transform: rotate(-45deg); opacity: 0; color: var(--on-accent); }
.check:hover .box { box-shadow: 0 0 10px var(--glow-strong); }
.check[aria-checked="true"] .box { background: var(--line); }
.check[aria-checked="true"] .box .ico { opacity: 1; }
.ai-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.ai-busy { font-style: italic; animation: breathe 1.6s ease-in-out infinite; }

/* ---------- Plan: Wochenleiste ---------- */
.strip { display: grid; grid-template-columns: 30px repeat(7, minmax(0, 1fr)) 30px; gap: 4px; align-items: stretch; }
.strip .icon-btn { width: 30px; height: auto; min-height: 58px; }
.daychip {
  min-width: 0;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 2px;
  padding: 6px 0 8px;
  background: var(--surface);
  border: 1px solid var(--sep);

  const newId = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
