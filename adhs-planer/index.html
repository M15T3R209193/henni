    cyan: { name: 'Cyan', dark: '#4fd8ff', light: '#0a7ea8' },
    violett: { name: 'Violett', dark: '#b39dff', light: '#6447d1' },
    pink: { name: 'Pink', dark: '#ff8cc6', light: '#c0307a' },
    orange: { name: 'Orange', dark: '#ffb26b', light: '#b0560c' },
    gruen: { name: 'Grün', dark: '#6fe3a5', light: '#1d7f4e' },
    gelb: { name: 'Gelb', dark: '#ffd75e', light: '#876b00' }
  };
  const FONTS = {
    klassisch: { name: 'Klassisch', note: 'Wie im System', fam: '"Cinzel", Georgia, serif' },
    klar: { name: 'Gut lesbar', note: 'Lexend', fam: '"Lexend", system-ui, sans-serif', url: 'Lexend:wght@400;500;600;700' },
    freundlich: { name: 'Freundlich', note: 'Rund und weich', fam: '"Nunito", system-ui, sans-serif', url: 'Nunito:wght@500;600;700;800' }
  };
  const SIZES = { s: { name: 'Klein', px: 15 }, m: { name: 'Normal', px: 16 }, l: { name: 'Groß', px: 18 }, xl: { name: 'Sehr groß', px: 20 } };
  const REMINDS = [[-1, 'Keine'], [0, 'Zur Uhrzeit'], [5, '5 Min vorher'], [10, '10 Min vorher'], [15, '15 Min vorher'], [30, '30 Min vorher'], [60, '1 Std vorher'], [1440, '1 Tag vorher']];
  const REMIND_VALS = REMINDS.map(r => r[0]);
  const DEF = {
    look: 'system', accent: '', font: 'klassisch', size: 'm', glow: true, motion: true, quest: true,
    maxPerDay: 3, timer: 15, stepSize: 's', remindDefault: 15, briefOn: true, briefTime: '08:00', sound: true, vibrate: true
  };

  function normSettings(x) {
    const s = { ...DEF };
    if (!x || typeof x !== 'object') return s;
    if (x.look in LOOKS) s.look = x.look;
    if (x.accent === '' || x.accent in ACCENTS) s.accent = x.accent;
    if (x.font in FONTS) s.font = x.font;
    if (x.size in SIZES) s.size = x.size;
    for (const k of ['glow', 'motion', 'quest', 'briefOn', 'sound', 'vibrate']) if (typeof x[k] === 'boolean') s[k] = x[k];
    const n = Math.round(Number(x.maxPerDay));
    if (n >= 1 && n <= 5) s.maxPerDay = n;
    if ([5, 15, 25, 45].includes(Number(x.timer))) s.timer = Number(x.timer);
    if (x.stepSize === 's' || x.stepSize === 'xs') s.stepSize = x.stepSize;
    if (x.remindDefault != null && REMIND_VALS.includes(Number(x.remindDefault))) s.remindDefault = Number(x.remindDefault);
    if (isTime(x.briefTime)) s.briefTime = x.briefTime;
    return s;
  }

  /* ---------- Daten ---------- */
  const blank = () => ({ v: 2, updatedAt: 0, activeId: null, tasks: [], routines: [], done: [], settings: { ...DEF } });

  function normalize(d) {
    const s = blank();
    if (!d || typeof d !== 'object') return s;
    s.updatedAt = Number(d.updatedAt) || 0;
    s.settings = normSettings(d.settings);
    const steps = a => Array.isArray(a)
      ? a.filter(x => x && typeof x.t === 'string' && x.t.trim()).slice(0, 60).map(x => ({ id: okId(x.id), t: x.t.slice(0, 200), done: !!x.done }))
      : [];
    if (Array.isArray(d.tasks)) {
      s.tasks = d.tasks.filter(t => t && typeof t.title === 'string' && t.title.trim()).slice(0, 400).map(t => ({
        id: okId(t.id),
        title: t.title.slice(0, 200),
        date: isDate(t.date) ? t.date : (t.where === 'heute' ? today() : ''),
        time: isTime(t.time) ? t.time : '',
        remind: (t.remind != null && REMIND_VALS.includes(Number(t.remind))) ? Number(t.remind) : s.settings.remindDefault,
        steps: steps(t.steps),
        note: str(t.note, 300),
        createdAt: Number(t.createdAt) || Date.now()
      }));
    }
    s.activeId = s.tasks.some(t => t.id === d.activeId && t.date) ? d.activeId : null;
    if (Array.isArray(d.routines)) {
      s.routines = d.routines.filter(r => r && typeof r.name === 'string' && r.name.trim()).slice(0, 20).map(r => ({
        id: okId(r.id),
        name: r.name.slice(0, 60),
        time: isTime(r.time) ? r.time : '',
        steps: steps(r.steps).map(({ id, t }) => ({ id, t })),
        day: str(r.day, 10),
        doneIds: Array.isArray(r.doneIds) ? r.doneIds.filter(x => typeof x === 'string').slice(0, 60) : []
      }));
    }
    if (Array.isArray(d.done)) {
      s.done = d.done.filter(x => x && typeof x.title === 'string').slice(-150).map(x => ({ title: x.title.slice(0, 200), at: Number(x.at) || 0 }));
    }
    return s;
  }

  let S = blank();
  const ui = { tab: 'jetzt', day: null, strip: null, open: null, parking: false, editR: null, win: null, planFor: null, remind: null, wipe: false };
  const ai = { fn: null, off: false, busy: null, ctl: null };

  const Q = (quest, plain) => (S.settings.quest ? quest : plain);
  const cap = () => S.settings.maxPerDay;
  const dayTasks = k => S.tasks.filter(t => t.date === k);
  const overdue = () => S.tasks.filter(t => t.date && t.date < today());
  const inbox = () => S.tasks.filter(t => !t.date);
  const isFull = k => dayTasks(k).length >= cap();
  const nextFree = k => { for (let i = 0; i < 90; i++) { const d = addDays(k, i); if (!isFull(d)) return d; } return null; };
  const byId = id => S.tasks.find(t => t.id === id);
  const active = () => (S.activeId ? byId(S.activeId) : null);
  const doneOn = k => S.done.filter(x => dayKey(new Date(x.at)) === k);
  const rDone = r => (r.day === today() ? r.doneIds : []);
  const hasContent = s => s.tasks.length || s.routines.length || s.done.length;

  function showDay(k) {
    const tk = today();
    ui.day = k;
    const strip = ui.strip || tk;
    if (k < strip || k > addDays(strip, 6)) ui.strip = (k >= tk && k <= addDays(tk, 6)) ? tk : k;
  }

  /* ---------- Speichern: Konto (db) mit Gerät als Rückfall ---------- */
  const LS = 'eins-nach-dem-anderen.v1';
  let ref = null, writing = false, again = false, wTimer = null, syncState = 'connecting', retries = 0;

  function loadLocal() {
    try { const raw = localStorage.getItem(LS); return raw ? normalize(JSON.parse(raw)) : null; } catch (e) { return null; }
  }
  function saveLocal() {
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { /* nur Komfort */ }
  }
  function setSync(s) { syncState = s; paintSync(); }
  function paintSync() {
    const el = $('#sync');
    const txt = { cloud: 'Gespeichert', saving: 'Speichert …', local: 'Nur auf diesem Gerät', connecting: 'Verbinde …' };
    el.dataset.s = syncState;
    el.textContent = txt[syncState] || '';
  }

  function commit() {
    S.updatedAt = Date.now();
    if (S.done.length > 150) S.done = S.done.slice(-150);
    saveLocal();
    render();
    queueRemote();
  }
  function queueRemote() {
    if (!ref) return;
    clearTimeout(wTimer);
    setSync('saving');
    wTimer = setTimeout(flush, 500);
  }
  async function flush() {
    wTimer = null;
    if (!ref) return;
    if (writing) { again = true; return; }
    writing = true;
    try {
      await ref.set(JSON.parse(JSON.stringify(S)));
      retries = 0;
      setSync('cloud');
    } catch (e) {
      writeFailed(e);
    } finally {
      writing = false;
      if (again) { again = false; flush(); }
    }
  }
  function writeFailed(e) {
    const code = e && e.code;
    if ((code === 'unavailable' || code === 'resource_exhausted') && retries < 3) {
      retries++;
      setTimeout(queueRemote, 1500 * retries + Math.random() * 1000);
      return;
    }
    if (code === 'quota_exceeded') {
      setSync('local');
      toast('Der Speicher ist voll. Lösch ein paar alte Einträge, dann klappt es wieder.');
      return;
    }
    ref = null;
    setSync('local');
    toast('Im Konto speichern klappt gerade nicht. Deine Sachen bleiben auf diesem Gerät.');
  }

  async function connect() {
    if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
    window.claude.use('sample').then(fn => { if (fn) { ai.fn = fn; render(); } }).catch(() => {});
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { /* ohne Konto */ }
    if (!db || !user) { setSync('local'); return; }
    const uid = await user.id();
    if (!uid) { setSync('local'); return; }
    try { ref = db.doc('data/users/' + uid + '/planer'); } catch (e) { ref = null; setSync('local'); return; }
    ref.onSnapshot(snap => {
      if (!snap.exists) {
        if (hasContent(S)) queueRemote(); else setSync('cloud');
        return;
      }
      if (snap.metadata.hasPendingWrites || wTimer || writing) return;
      const remote = normalize(snap.data());
      if (remote.updatedAt > S.updatedAt) {
        S = remote;
        saveLocal();
        render();
      } else if (remote.updatedAt < S.updatedAt) {
        queueRemote();
        return;
      }
      setSync('cloud');
    }, () => { ref = null; setSync('local'); });
  }

  /* ---------- Aufgaben ---------- */
  const lines = v => v.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  const mkTask = (title, date) => ({ id: newId(), title: title.slice(0, 200), date, time: '', remind: S.settings.remindDefault, steps: [], note: '', createdAt: Date.now() });
  const undoable = () => {
    const snap = JSON.stringify(S);
    return msg => toast(msg, { label: 'Rückgängig', run() { S = normalize(JSON.parse(snap)); commit(); } });
  };
  const fullMsg = k => {
    const nf = nextFree(addDays(k, 1));
    return [`${shortDay(k)} ist schon voll (${cap()} von ${cap()}).`, nf];
  };

  function addTasks(text, date, openFirst) {
    const ls = lines(text);
    if (!ls.length) return;
    let added = 0, overflow = 0, first = null;
    for (const l of ls) {
      if (date && isFull(date)) { S.tasks.push(mkTask(l, '')); overflow++; continue; }
      const t = mkTask(l, date);
      S.tasks.push(t);
      if (!first) first = t;
      added++;
    }
    if (openFirst && first && added === 1) ui.open = first.id;
    commit();
    if (overflow) toast(`${shortDay(date)} ist voll. ${overflow === 1 ? 'Eine Sache liegt' : overflow + ' Sachen liegen'} in „Kopf leeren“.`);
    else if (!date && ui.tab !== 'kopf') toast('Notiert. Liegt in „Kopf leeren“.');
    else if (!date && added > 1) toast(`${added} Einträge notiert.`);
  }

  function schedule(id, date, quiet) {
    const t = byId(id);
    if (!t) return false;
    if (date && date !== t.date && isFull(date)) {
      const [msg, nf] = fullMsg(date);
      toast(msg, nf ? { label: `${shortDay(nf)} nehmen`, run() { schedule(id, nf); } } : null);
      return false;
    }
    if (date !== t.date) {
      S.tasks = S.tasks.filter(x => x !== t);
      S.tasks.push(t);
      if (S.activeId === id && date !== today()) S.activeId = null;
    }
    t.date = date;
    ui.planFor = null;
    commit();
    if (!quiet) {
      if (date) toast(`Eingeplant: ${shortDay(date)}`, { label: 'Mini-Schritte', run() { ui.tab = 'plan'; showDay(date); ui.open = id; render(); window.scrollTo(0, 0); } });
      else toast('Zurück in „Kopf leeren“.');
    }
    return true;
  }
  function saveEdit(id) {
    const t = byId(id);
    if (!t) return;
    const val = k => (document.getElementById(`ed-${k}-${id}`) || {}).value || '';
    const title = val('ti').trim(), date = isDate(val('da')) ? val('da') : '', time = isTime(val('tm')) ? val('tm') : '';
    const re = Number(val('re'));
    if (!title) { toast('Der Titel darf nicht leer sein.'); return; }
    if (date && date !== t.date && isFull(date)) {
      const [msg, nf] = fullMsg(date);
      toast(msg, nf ? { label: `${shortDay(nf)} nehmen`, run() { const el = document.getElementById(`ed-da-${id}`); if (el) el.value = nf; saveEdit(id); } } : null);
      return;
    }
    if (date !== t.date) {
      S.tasks = S.tasks.filter(x => x !== t);
      S.tasks.push(t);
      if (S.activeId === id && date !== today()) S.activeId = null;
    }
    Object.assign(t, { title: title.slice(0, 200), date, time, remind: REMIND_VALS.includes(re) ? re : -1 });
    ui.open = null;
    if (date) showDay(date);
    commit();
    toast(time && t.remind >= 0 ? `Gespeichert. Erinnerung ${t.remind ? remindText(t.remind).toLowerCase() : 'um ' + time + ' Uhr'}.` : 'Gespeichert.');
  }
  function delTask(id) {
    const t = byId(id);
    if (!t) return;
    const done = undoable();
    S.tasks = S.tasks.filter(x => x !== t);
    if (S.activeId === id) S.activeId = null;
    ui.open = null;
    commit();
    done('Gelöscht.');
  }
  function move(id, dir) {
    const t = byId(id);
    if (!t) return;
    const h = dayTasks(t.date);
    const i = h.indexOf(t), j = i + dir;
    if (i < 0 || j < 0 || j >= h.length) return;
    const a = S.tasks.indexOf(h[i]), b = S.tasks.indexOf(h[j]);
    [S.tasks[a], S.tasks[b]] = [S.tasks[b], S.tasks[a]];
    commit();
  }
  function start(id, mins) {
    const cur = active();
    if (cur && cur.id !== id) { toast(`Erst „${cur.title}“ fertig machen oder parken.`); return; }
    const t = byId(id);
    if (!t) return;
    if (t.date !== today()) {
      if (!schedule(id, today(), true)) return;
    }
    S.activeId = id;
    ui.tab = 'jetzt';
    ui.win = null;
    ui.parking = false;
    if (mins) { tSet(mins); tStart(); }
    commit();
    window.scrollTo(0, 0);
  }
  function complete(t) {
    S.done.push({ title: t.title, at: Date.now() });
    S.tasks = S.tasks.filter(x => x !== t);
    if (S.activeId === t.id) S.activeId = null;
    ui.win = { title: t.title, msg: WINS[Math.floor(Math.random() * WINS.length)] };
    ui.parking = false;
    ui.open = null;
  }
  function finish() {
    const t = active();
    if (!t) return;
    complete(t);
    tReset();
    ui.tab = 'jetzt';
    commit();
    window.scrollTo(0, 0);
    burst();
  }
  function doneDirect(id) {
    const t = byId(id);
    if (!t) return;
    complete(t);
    ui.win = null;
    commit();
    toast(`Erledigt: ${t.title}`);
    burst();
  }
  function park(note) {
    const t = active();
    if (!t) return;
    t.note = note.slice(0, 300);
    S.activeId = null;
    ui.parking = false;
    if (T.endsAt) tPause();
    commit();
    toast(t.note ? Q('Speicherpunkt gesetzt. Deine Notiz wartet auf dich.', 'Geparkt. Deine Notiz wartet auf dich.') : 'Geparkt.');
  }
  function addSteps(id, text) {
    const t = byId(id);
    if (!t) return;
    for (const l of lines(text)) t.steps.push({ id: newId(), t: l.slice(0, 200), done: false });
    commit();
  }
  function toggleStep(id, sid) {
    const s = byId(id)?.steps.find(x => x.id === sid);
    if (!s) return;
    s.done = !s.done;
    commit();
  }
  function nextStepDone(id) {
    const s = byId(id)?.steps.find(x => !x.done);
    if (!s) return;
    s.done = true;
    commit();
    const t = byId(id);
    if (t && t.steps.every(x => x.done)) toast('Alle Schritte erledigt. Jetzt den großen Haken.');
  }
  function delStep(id, sid) {
    const t = byId(id);
    if (!t) return;
    t.steps = t.steps.filter(x => x.id !== sid);
    commit();
  }
  function clearNote(id) {
    const t = byId(id);
    if (!t) return;
    t.note = '';
    commit();
  }

  /* KI: Aufgabe in Mini-Schritte zerlegen */
  async function aiSplit(id) {
    const t = byId(id);
    if (!t || !ai.fn || ai.busy) return;
    const size = S.settings.stepSize === 'xs'
      ? '5 bis 9 sehr kleine Schritte (jeder dauert höchstens 2 bis 5 Minuten)'
      : '3 bis 6 kleine Schritte (jeder dauert etwa 5 bis 15 Minuten)';
    const have = t.steps.length ? `\nSchon vorhandene Schritte (nicht wiederholen, nur passend ergänzen):\n${t.steps.map(s => '- ' + s.t).join('\n')}\n` : '';
    const prompt = `Du hilfst einer Person mit ADHS, eine Aufgabe anzufangen und zu Ende zu bringen.
Zerlege die Aufgabe in ${size}, in der Reihenfolge, in der man sie macht.
Regeln: jeder Schritt höchstens 8 Wörter, beginnt mit einem Verb, Deutsch, du-Form, keine Nummerierung, konkret und sichtbar machbar. Der erste Schritt ist lächerlich leicht.

Aufgabe: ${t.title}${have}
Antworte nur mit JSON in dieser Form: {"steps": ["Erster Schritt", "Zweiter Schritt"]}`;
    ai.busy = id;
    ai.ctl = new AbortController();
    render();
    try {
      const res = await ai.fn.json(prompt, { modelTier: 'quick', signal: ai.ctl.signal });
      const arr = Array.isArray(res) ? res : (res && Array.isArray(res.steps) ? res.steps : []);
      const clean = arr.map(x => String(x).replace(/^\s*[-–•\d.)]+\s*/, '').trim()).filter(Boolean).slice(0, 12);
      const task = byId(id);
      if (!clean.length || !task) { toast('Da kam nichts Brauchbares zurück. Versuch es nochmal.'); return; }
      for (const c of clean) task.steps.push({ id: newId(), t: c.slice(0, 200), done: false });
      ai.busy = null;
      commit();
      toast(`${clean.length} Mini-Schritte angelegt. Ändern oder löschen geht jederzeit.`);
    } catch (e) {
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {
        ai.off = true;
        toast('Automatisch zerlegen ist hier nicht verfügbar. Schreib die Schritte selbst auf.');
      } else if (code === 'rate_limited') {
        toast('Gerade zu viele Anfragen. Versuch es in einer Minute nochmal.');
      } else if (code === 'refused') {
        toast('Dafür gibt es keine Vorschläge. Schreib die Schritte selbst auf.');
      } else if (code !== 'cancelled') {
        toast('Hat nicht geklappt. Versuch es nochmal.');
      }
    } finally {
      ai.busy = null;
      ai.ctl = null;
      render();
    }
  }

  /* Routinen */
  const rById = id => S.routines.find(r => r.id === id);
  function templates() {
    const mk = (name, time, steps) => ({ id: newId(), name, time, steps: steps.map(t => ({ id: newId(), t })), day: '', doneIds: [] });
    S.routines.push(
      mk('Morgens', '07:30', ['Ein Glas Wasser trinken', 'Medikamente nehmen', 'Zähne putzen', 'Anziehen', 'Frühstücken', 'Schlüssel, Handy, Geldbeutel einpacken']),
      mk('Abends', '21:30', ['5 Minuten Küche klar machen', 'Sachen für morgen hinlegen', 'Handy ans Ladekabel', 'Zähne putzen', 'Die wichtigste Sache für morgen in „Kopf leeren“ notieren'])
    );
    commit();
  }
  function rToggle(id, sid) {
    const r = rById(id);
    if (!r) return;
    if (r.day !== today()) { r.day = today(); r.doneIds = []; }
    const had = r.doneIds.includes(sid);
    r.doneIds = had ? r.doneIds.filter(x => x !== sid) : r.doneIds.concat(sid);
    commit();
    if (!had && r.steps.length && r.steps.every(s => r.doneIds.includes(s.id))) {
      toast(`${r.name}: für heute geschafft.`);
      burst();
    }
  }
  function rReset(id) { const r = rById(id); if (!r) return; r.doneIds = []; commit(); }
  function rAdd(name) {
    const r = { id: newId(), name: name.slice(0, 60), time: '', steps: [], day: '', doneIds: [] };
    S.routines.push(r);
    ui.editR = r.id;
    commit();
  }
  function rDel(id) {
    const done = undoable();
    S.routines = S.routines.filter(r => r.id !== id);
    ui.editR = null;
    commit();
    done('Routine gelöscht.');
  }
  function rAddStep(id, text) {
    const r = rById(id);
    if (!r) return;
    for (const l of lines(text)) r.steps.push({ id: newId(), t: l.slice(0, 200) });
    commit();
  }
  function rDelStep(id, sid) {
    const r = rById(id);
    if (!r) return;
    r.steps = r.steps.filter(s => s.id !== sid);
    r.doneIds = r.doneIds.filter(x => x !== sid);
    commit();
  }
  function rSave(id) {
    const r = rById(id);
    if (!r) return;
    const name = (document.getElementById('rr-name-' + id) || {}).value || '';
    const time = (document.getElementById('rr-time-' + id) || {}).value || '';
    if (name.trim()) r.name = name.trim().slice(0, 60);
    r.time = isTime(time) ? time : '';
    commit();
    toast(r.time ? `Gespeichert. Erinnerung täglich um ${r.time} Uhr.` : 'Gespeichert.');
  }
  function rMove(id, dir) {
    const i = S.routines.findIndex(r => r.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= S.routines.length) return;
    [S.routines[i], S.routines[j]] = [S.routines[j], S.routines[i]];
    commit();
  }

  /* Einstellungen setzen */
  function setSetting(k, v) {
    const next = { ...S.settings, [k]: v };
    S.settings = normSettings(next);
    if (k === 'timer' && !T.endsAt) tSet(S.settings.timer);
    commit();
  }
  const loaded = {};
  function ensureFont(key) {
    const f = FONTS[key];
    if (!f || !f.url || loaded[key]) return;
    loaded[key] = true;
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = `https://fonts.googleapis.com/css2?family=${f.url}&display=swap`;
    document.head.appendChild(l);
  }
  function applySettings() {
    const st = S.settings, root = document.documentElement, look = LOOKS[st.look];
    root.dataset.look = st.look;
    root.dataset.font = st.font;
    root.dataset.glow = st.glow ? 'on' : 'off';
    root.dataset.motion = st.motion ? 'on' : 'off';
    root.style.fontSize = SIZES[st.size].px + 'px';
    const ac = ACCENTS[st.accent || look.accent];
    root.style.setProperty('--line', look.dark ? ac.dark : ac.light);
    root.style.setProperty('--on-accent', look.dark ? '#07101e' : '#ffffff');
    ensureFont(st.font);
  }

  /* ---------- Timer (Zeitscheibe, 60 Minuten = voller Kreis) ---------- */
  const TK = 'eins-nach-dem-anderen.timer';
  let T = (() => {
    try { const t = JSON.parse(localStorage.getItem(TK)); if (t && t.total > 0 && t.preset > 0) return t; } catch (e) { /* frisch */ }
    return { preset: 15, total: 900000, left: 900000, endsAt: null };
  })();
  let tick = null, ac = null;
  const saveT = () => { try { localStorage.setItem(TK, JSON.stringify(T)); } catch (e) { /* nur Komfort */ } };
  const tLeft = () => (T.endsAt ? Math.max(0, T.endsAt - Date.now()) : T.left);
  const fmt = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };

  function tSet(min) { T = { preset: min, total: min * 60000, left: min * 60000, endsAt: null }; saveT(); stopTick(); }
  function tReset() { tSet(S.settings.timer); }
  function tStart() {
    unlockAudio();
    if (tLeft() <= 0) { T.left = T.total = T.preset * 60000; }
    T.endsAt = Date.now() + T.left;
    saveT();
    startTick();
  }
  function tPause() { T.left = tLeft(); T.endsAt = null; saveT(); stopTick(); }
  function tAdd5() {
    if (T.endsAt) T.endsAt += 300000; else T.left += 300000;
    T.total = Math.max(T.total, tLeft());
    saveT();
    if (T.endsAt) startTick();
  }
  function startTick() {
    stopTick();
    tick = setInterval(() => {
      paintTimer();
      if (T.endsAt && tLeft() <= 0) {
        T.endsAt = null;
        T.left = 0;
        saveT();
        stopTick();
        alertOut();
        toast('Zeit ist um.');
        render();
      }
    }, 250);
  }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
  function unlockAudio() {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!ac && C) ac = new C();
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { /* ohne Ton */ }
  }
  function chime() {
    try {
      if (!ac || ac.state !== 'running') return;
      const t0 = ac.currentTime;
      [660, 784, 988].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), d = i * 0.32;
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.22, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.3);
        o.connect(g).connect(ac.destination);
        o.start(t0 + d);
        o.stop(t0 + d + 0.32);
      });
    } catch (e) { /* ohne Ton */ }
  }
  function alertOut() {
    if (S.settings.sound) chime();
    if (S.settings.vibrate) { try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ohne Vibration */ } }
  }

  function wedge(ms) {
    const ang = Math.min(360, ms / 3600000 * 360), R = 44;
    if (ang <= 0.05) return '';
    if (ang >= 359.9) return `M0 ${-R}A${R} ${R} 0 1 1 0 ${R}A${R} ${R} 0 1 1 0 ${-R}Z`;
    const a = ang * Math.PI / 180;
    return `M0 0L0 ${-R}A${R} ${R} 0 ${ang > 180 ? 1 : 0} 1 ${(R * Math.sin(a)).toFixed(2)} ${(-R * Math.cos(a)).toFixed(2)}Z`;
  }
  function dialSVG(ms) {
    let ticks = '';
    for (let m = 0; m < 60; m += 5) {
      const a = m * 6 * Math.PI / 180, major = m % 15 === 0, r1 = major ? 39 : 41.5, r2 = 45;
      ticks += `<line class="tick${major ? ' major' : ''}" x1="${(Math.sin(a) * r1).toFixed(2)}" y1="${(-Math.cos(a) * r1).toFixed(2)}" x2="${(Math.sin(a) * r2).toFixed(2)}" y2="${(-Math.cos(a) * r2).toFixed(2)}"/>`;
    }
    const nums = [0, 15, 30, 45].map(m => {
      const a = m * 6 * Math.PI / 180;
      return `<text class="num" x="${(Math.sin(a) * 53).toFixed(2)}" y="${(-Math.cos(a) * 53).toFixed(2)}" text-anchor="middle" dominant-baseline="central">${m}</text>`;
    }).join('');
    return `<svg viewBox="-60 -60 120 120" aria-hidden="true"><circle class="face" r="45"/><path class="wedge" id="wedge" d="${wedge(ms)}"/>${ticks}<circle class="hub" r="4"/>${nums}</svg>`;
  }
  function paintTimer() {
    const w = $('#wedge'), r = $('#t-read'), d = $('#dial');
    if (!w || !r) return;
    const left = tLeft();
    w.setAttribute('d', wedge(left));
    r.textContent = fmt(left);
    if (d) d.classList.toggle('low', !!T.endsAt && left < 60000);
  }

  /* ---------- Erinnerungen (solange der Planer offen ist) ---------- */
  const FK = 'eins-nach-dem-anderen.fired';
  let fired = (() => { try { return JSON.parse(localStorage.getItem(FK)) || {}; } catch (e) { return {}; } })();
  const snoozed = {};
  function saveFired() {
    try {
      const cut = Date.now() - 4 * 864e5;
      for (const k in fired) if (fired[k] < cut) delete fired[k];
      localStorage.setItem(FK, JSON.stringify(fired));
    } catch (e) { /* nur Komfort */ }
  }
  const remindText = m => (m === 0 ? 'Jetzt' : m === 60 ? 'In 1 Stunde' : m === 1440 ? 'Morgen' : `In ${m} Minuten`);

  function dueReminders(now) {
    const out = [], tk = today();
    for (const t of S.tasks) {
      if (!t.date || !t.time || t.remind < 0) continue;
      const due = at(t.date, t.time), when = due - t.remind * 60000;
      out.push({ key: `t:${t.id}:${when}`, when, until: due + 2 * 3600e3, kind: 'task', id: t.id, title: t.title,
        body: t.remind > 0 ? `${remindText(t.remind)}, um ${t.time} Uhr (${shortDay(t.date)})` : `Jetzt, ${t.time} Uhr` });
    }
    for (const r of S.routines) {
      if (!r.time || !r.steps.length) continue;
      const open = r.steps.filter(s => !rDone(r).includes(s.id)).length;
      if (!open) continue;
      const when = at(tk, r.time);
      out.push({ key: `r:${r.id}:${when}`, when, until: when + 6 * 3600e3, kind: 'routine', id: r.id,
        title: `Routine: ${r.name}`, body: `${open} ${open === 1 ? 'Schritt' : 'Schritte'} offen. Fang mit dem ersten an.` });
    }
    if (S.settings.briefOn) {
      const when = at(tk, S.settings.briefTime), list = dayTasks(tk);
      out.push({ key: `b:${tk}:${when}`, when, until: when + 12 * 3600e3, kind: 'brief',
        title: list.length ? `Heute ${list.length === 1 ? 'steht 1 Sache' : 'stehen ' + list.length + ' Sachen'} an` : 'Heute ist noch nichts geplant',
        body: list.length ? list.map(t => (t.time ? t.time + ' ' : '') + t.title).join(' · ') : 'Nimm dir eine Sache aus „Kopf leeren“ oder plane den Tag.' });
    }
    return out.filter(r => now >= r.when && now <= r.until && !fired[r.key] && !(snoozed[r.key] > now)).sort((a, b) => a.when - b.when);
  }
  function checkReminders() {
    if (ui.remind) return;
    const due = dueReminders(Date.now());
    if (!due.length) return;
    ui.remind = due[0];
    paintRemind();
    alertOut();
  }
  function paintRemind() {
    const el = $('#remind'), r = ui.remind;
    if (!r) { el.hidden = true; el.innerHTML = ''; return; }
    let go = '';
    if (r.kind === 'task') go = (S.activeId === r.id) ? Q('Zur aktiven Quest', 'Zur Aufgabe') : (!S.activeId ? 'Jetzt starten' : 'Ansehen');
    if (r.kind === 'routine') go = 'Zur Routine';
    if (r.kind === 'brief') go = 'Tag ansehen';
    el.innerHTML = `<p class="eyebrow">${ICON.bell} Erinnerung</p>
      <p class="remind-title">${esc(r.title)}</p>
      ${r.body ? `<p class="remind-body">${esc(r.body)}</p>` : ''}
      <div class="row">
        ${go ? `<button class="btn btn-solid btn-sm" type="button" data-a="rm-go">${go}</button>` : ''}
        <button class="btn btn-sm" type="button" data-a="rm-snooze">In 5 Min nochmal</button>
        <button class="btn btn-quiet btn-sm" type="button" data-a="rm-ok">Ok</button>
      </div>`;
    el.hidden = false;
  }
  function closeRemind(markFired) {
    const r = ui.remind;
    if (!r) return;
    if (markFired && r.key !== 'test') { fired[r.key] = Date.now(); saveFired(); }
    ui.remind = null;
    paintRemind();
    setTimeout(checkReminders, 400);
  }
  function remindGo() {
    const r = ui.remind;
    if (!r) return;
    closeRemind(true);
    if (r.kind === 'task') {
      const t = byId(r.id);
      if (!t) return;
      if (S.activeId === t.id) { ui.tab = 'jetzt'; render(); }
      else if (!S.activeId && t.date === today()) start(t.id);
      else { ui.tab = 'plan'; showDay(t.date || today()); ui.open = t.id; render(); }
    } else if (r.kind === 'routine') { ui.tab = 'routinen'; render(); }
    else if (r.kind === 'brief') { ui.tab = 'plan'; showDay(today()); render(); }
    window.scrollTo(0, 0);
  }

  /* Google-Kalender-Link (öffnet in neuem Tab) */
  function gcal(t) {
    const f = x => `${x.getFullYear()}${pad(x.getMonth() + 1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
    let dates;
    if (t.time) {
      const s = new Date(at(t.date, t.time));
      dates = `${f(s)}/${f(new Date(s.getTime() + 30 * 60000))}`;
    } else {
      dates = `${t.date.replace(/-/g, '')}/${addDays(t.date, 1).replace(/-/g, '')}`;
    }
    const details = t.steps.length ? 'Mini-Schritte:\n' + t.steps.map(s => '– ' + s.t).join('\n') : '';
    let tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { /* ohne Zeitzone */ }
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(t.title) + '&dates=' + dates
      + (details ? '&details=' + encodeURIComponent(details) : '') + (tz ? '&ctz=' + encodeURIComponent(tz) : '');
  }

  /* ---------- Ansichten ---------- */
  function savepoint(t, removable) {
    if (!t.note) return '';
    return `<div class="savepoint">
      <div class="savepoint-text"><p class="lbl">${Q('Speicherpunkt', 'Weiter bei')}</p><p>${esc(t.note)}</p></div>
      ${removable ? `<button class="icon-btn" type="button" data-a="clear-note" data-id="${t.id}" aria-label="Notiz entfernen">${ICON.x}</button>` : ''}
    </div>`;
  }
  const whenLine = t => (t.time ? `<p class="when">${ICON.clock} ${t.date === today() ? 'Heute' : esc(shortDay(t.date))} um ${t.time} Uhr${t.remind >= 0 ? ' · ' + ICON.bell : ''}</p>` : '');

  function stepsEditor(t) {
    const list = t.steps.length ? `<ul class="steps">${t.steps.map(s => `
      <li class="step${s.done ? ' is-done' : ''}">
        <button class="check" type="button" role="checkbox" aria-checked="${s.done}" aria-label="${esc(s.t)}" data-a="toggle-step" data-id="${t.id}" data-sid="${s.id}"><span class="box">${ICON.check}</span></button>
        <span class="step-text">${esc(s.t)}</span>
        <button class="icon-btn" type="button" data-a="del-step" data-id="${t.id}" data-sid="${s.id}" aria-label="Schritt löschen">${ICON.x}</button>
      </li>`).join('')}</ul>` : '';
    let aiRow = '';
    if (ai.fn && !ai.off) {
      aiRow = ai.busy === t.id
        ? `<div class="ai-row"><span class="hint ai-busy">Zerlege in Mini-Schritte …</span><button class="link" type="button" data-a="ai-stop">Abbrechen</button></div>`
        : `<div class="ai-row"><button class="btn btn-sm" type="button" data-a="ai" data-id="${t.id}"${ai.busy ? ' disabled' : ''}>${ICON.spark} ${t.steps.length ? 'Weitere Schritte vorschlagen' : 'Automatisch in Mini-Schritte zerlegen'}</button></div>`;
    }
    return `${list}
      <form class="field" data-f="step" data-id="${t.id}">
        <input class="input" id="in-step-${t.id}" placeholder="${t.steps.length ? 'Noch ein Mini-Schritt' : 'Erster Mini-Schritt'}" autocomplete="off" aria-label="Mini-Schritt hinzufügen">
        <button class="btn" type="submit">Dazu</button>
      </form>
      ${aiRow}`;
  }

  function timerHTML() {
    const left = tLeft(), run = !!T.endsAt, over = !run && left <= 0;
    return `<div class="timer">
      <div class="dial${run && left < 60000 ? ' low' : ''}" id="dial">${dialSVG(left)}</div>
      <div class="t-side">
        <p class="lbl">${over ? 'Zeit ist um' : run ? Q('Zeitlimit läuft', 'Timer läuft') : Q('Zeitlimit', 'Timer')}</p>
        <p class="t-read" id="t-read">${fmt(left)}</p>
        ${over ? '<p class="hint">Noch eine Runde oder kurz Pause? Beides ist okay.</p>' : ''}
        <div class="chips">
          ${run
            ? `<button class="btn btn-sm" type="button" data-a="t-pause">Pause</button>`
            : `<button class="btn btn-sm" type="button" data-a="t-start">${ICON.play} ${over ? 'Nochmal' : 'Start'}</button>`}
          <button class="chip" type="button" data-a="t-add5">+5 Min</button>
        </div>
        <div class="chips" role="group" aria-label="Dauer wählen">
          ${[5, 15, 25, 45].map(m => `<button class="chip" type="button" data-a="t-set" data-min="${m}" aria-pressed="${T.preset === m}">${m} Min</button>`).join('')}
        </div>
      </div>
    </div>`;
  }

  function vJetzt() {
    const t = active();
    if (t) {
      const open = t.steps.filter(s => !s.done), next = open[0];
      let nextHTML;
      if (next) {
        nextHTML = `<div class="next">
          <p class="lbl">Nächster kleiner Schritt · ${t.steps.length - open.length + 1} von ${t.steps.length}</p>
          <p class="step-big"><mark>${esc(next.t)}</mark></p>
          <button class="btn" type="button" data-a="stepdone" data-id="${t.id}">${ICON.check} Schritt erledigt</button>
        </div>`;
      } else if (t.steps.length) {
        nextHTML = `<div class="next"><p class="step-big">Alle Schritte erledigt. Zeit für den großen Haken.</p></div>`;
      } else {
        nextHTML = `<div class="next"><p class="hint">Fühlt sich zu groß an? Zerleg es unten in Mini-Schritte. Der erste darf lächerlich klein sein.</p></div>`;
      }
      return `<div class="stack">
        <article class="panel corners focus">
          <div class="focus-head">
            <p class="eyebrow">${Q('Aktive Quest', 'Jetzt dran')}</p>
            <h2 class="h-view now-title">${esc(t.title)}</h2>
            ${whenLine(t)}
          </div>
          ${savepoint(t, true)}
          ${nextHTML}
          ${timerHTML()}
          <div class="actions">
            <button class="btn btn-solid btn-big" type="button" data-a="finish">${ICON.check} Fertig</button>
            <button class="btn btn-quiet btn-big" type="button" data-a="park-open" aria-expanded="${ui.parking}">Parken</button>
          </div>
          ${ui.parking ? `<form class="park" data-f="park">
            <label class="lbl" for="in-park">${Q('Speicherpunkt setzen', 'Wo hörst du auf?')}</label>
            <p class="hint">Was ist der nächste Handgriff? Dann findest du später sofort wieder rein.</p>
            <input class="input" id="in-park" value="${esc(t.note)}" placeholder="z. B. Formular liegt bereit, als Nächstes Seite 2 ausfüllen" autocomplete="off">
            <div class="row">
              <button class="btn" type="submit">${ICON.save} Parken</button>
              <button class="btn btn-quiet" type="button" data-a="park-cancel">Doch weitermachen</button>
            </div>
          </form>` : ''}
        </article>
        <section class="block" aria-labelledby="h-steps">
          <h3 class="h-sec" id="h-steps">Mini-Schritte</h3>
          ${stepsEditor(t)}
        </section>
        <form class="block" data-f="capture">
          <label class="lbl" for="in-cap">Gedanke dazwischen?</label>
          <div class="field">
            <input class="input" id="in-cap" placeholder="Kurz notieren, später erledigen" autocomplete="off">
            <button class="btn" type="submit">Notieren</button>
          </div>
          <p class="hint">Landet in „Kopf leeren“. ${Q('Du bleibst hier bei deiner Quest.', 'Du bleibst bei deiner Aufgabe.')}</p>
        </form>
      </div>`;
    }

    const tk = today(), h = dayTasks(tk), n = h[0], dt = doneOn(tk), od = overdue();
    let out = '';
    if (ui.win) {
      out += `<div class="panel win" role="status">
        <span class="diamond" aria-hidden="true"></span>
        <p class="win-title">${Q('Quest abgeschlossen', 'Geschafft')}</p>
        <p class="win-task">${esc(ui.win.title)}</p>
        <p class="win-msg">${esc(ui.win.msg)}</p>
      </div>`;
    }
    if (n) {
      const sd = n.steps.filter(s => s.done).length;
      out += `<article class="panel corners focus">
        <div class="focus-head">
          <p class="eyebrow">Als Nächstes dran</p>
          <h2 class="h-view now-title">${esc(n.title)}</h2>
          ${whenLine(n)}
          ${n.steps.length ? `<p class="hint">${sd} von ${n.steps.length} Mini-Schritten erledigt</p>` : ''}
        </div>
        ${savepoint(n, false)}
        <div class="actions">
          <button class="btn btn-solid btn-big" type="button" data-a="start" data-id="${n.id}">${ICON.play} Starten</button>
          <button class="btn btn-big" type="button" data-a="start5" data-id="${n.id}">Nur 5 Minuten</button>
        </div>
        <p class="hint">Anfangen ist das Schwerste. Fünf Minuten reichen. Danach darfst du aufhören.</p>
      </article>`;
      if (h.length > 1) out += `<p class="hint">Danach: ${h.slice(1).map(t => esc(t.title)).join(' · ')}. Die Reihenfolge änderst du im Plan.</p>`;
    } else {
      out += `<article class="panel corners focus">
        <div class="focus-head">
          <p class="eyebrow">Jetzt</p>
          <h2 class="h-view">${dt.length ? 'Alles für heute erledigt' : 'Gerade läuft nichts'}</h2>
          <p class="sub">${dt.length
            ? 'Du kannst Feierabend machen. Oder du holst dir noch eine Sache.'
            : 'Was ist die eine Sache, die heute zählt? Schreib sie auf und fang an.'}</p>
        </div>
        <form class="field" data-f="idle-add">
          <input class="input" id="in-idle" placeholder="Eine Sache für heute" autocomplete="off" aria-label="Eine Sache für heute">
          <button class="btn btn-solid" type="submit">Los</button>
        </form>
        ${inbox().length ? `<button class="link" type="button" data-a="tab" data-tab="kopf">Oder eine aus „Kopf leeren“ holen (${inbox().length})</button>` : ''}
      </article>`;
    }
    if (od.length) out += `<button class="link" type="button" data-a="tab" data-tab="plan">${od.length === 1 ? 'Eine Sache ist' : od.length + ' Sachen sind'} von früher noch offen. Im Plan ansehen</button>`;
    if (dt.length) out += `<p class="tally">Heute abgeschlossen: <strong>${dt.length}</strong></p>`;
    return `<div class="stack">${out}</div>`;
  }

  function editorHTML(t) {
    return `<form class="block" data-f="edit" data-id="${t.id}">
        <div class="fld"><label class="lbl" for="ed-ti-${t.id}">Titel</label><input class="input" id="ed-ti-${t.id}" value="${esc(t.title)}" autocomplete="off"></div>
        <div class="edit-grid">
          <div class="fld"><label class="lbl" for="ed-da-${t.id}">Tag</label><input class="input" type="date" id="ed-da-${t.id}" value="${t.date}"></div>
          <div class="fld"><label class="lbl" for="ed-tm-${t.id}">Uhrzeit</label><input class="input" type="time" id="ed-tm-${t.id}" value="${t.time}"></div>
          <div class="fld"><label class="lbl" for="ed-re-${t.id}">Erinnerung</label><select class="input" id="ed-re-${t.id}">${REMINDS.map(([v, l]) => `<option value="${v}"${v === t.remind ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
        </div>
        ${!t.time ? '<p class="hint">Mit Uhrzeit erinnert dich der Planer rechtzeitig. Ohne Uhrzeit steht die Aufgabe im Tagesüberblick.</p>' : ''}
        <div class="row">
          <button class="btn btn-solid btn-sm" type="submit">Speichern</button>
          ${t.date ? `<a class="link" href="${esc(gcal(t))}" target="_blank" rel="noopener">In Google Kalender eintragen</a>` : ''}
        </div>
      </form>
      <div class="block"><p class="lbl">Mini-Schritte</p>${stepsEditor(t)}</div>
      <div class="row">
        <button class="btn btn-sm" type="button" data-a="done-direct" data-id="${t.id}">${ICON.check} Schon erledigt</button>
        ${t.date ? `<button class="btn btn-quiet btn-sm" type="button" data-a="unplan" data-id="${t.id}">Zurück in „Kopf leeren“</button>` : ''}
        <button class="btn btn-danger btn-sm" type="button" data-a="del-task" data-id="${t.id}">Löschen</button>
      </div>`;
  }

  function slotHTML(t, i, len, isToday) {
    const isAct = t.id === S.activeId, sd = t.steps.filter(s => s.done).length, isOpen = ui.open === t.id;
    let foot = '';
    if (isAct) foot = `<button class="btn btn-solid btn-sm" type="button" data-a="tab" data-tab="jetzt">${Q('Zur aktiven Quest', 'Zur aktuellen Aufgabe')}</button>`;
    else if (isToday && i === 0 && !S.activeId) foot = `<button class="btn btn-solid btn-sm" type="button" data-a="start" data-id="${t.id}">${ICON.play} Starten</button><button class="btn btn-sm" type="button" data-a="start5" data-id="${t.id}">Nur 5 Min</button>`;
    else if (!isOpen && !t.steps.length) foot = `<button class="link" type="button" data-a="open" data-id="${t.id}">Uhrzeit, Erinnerung, Mini-Schritte</button>`;
    const pills = [
      isAct ? '<span class="pill pill-live">läuft gerade</span>' : '',
      t.time ? `<span class="pill">${ICON.clock}${t.time}${t.remind >= 0 ? ' ' + ICON.bell : ''}</span>` : '',
      t.steps.length ? `<span class="pill">${sd}/${t.steps.length} Schritte</span>` : '',
      t.note ? `<span class="pill pill-save">Weiter bei: ${esc(t.note)}</span>` : ''
    ].join('');
    return `<li class="slot${i === 0 && isToday ? ' is-first' : ''}">
      <span class="slot-num" aria-hidden="true">${i + 1}</span>
      <div class="slot-body">
        <button class="slot-title" type="button" data-a="open" data-id="${t.id}" aria-expanded="${isOpen}">${esc(t.title)}</button>
        ${pills ? `<div class="meta">${pills}</div>` : ''}
      </div>
      <div class="slot-actions">
        <button class="icon-btn" type="button" data-a="up" data-id="${t.id}" aria-label="Nach oben"${i === 0 ? ' disabled' : ''}>${ICON.up}</button>
        <button class="icon-btn" type="button" data-a="down" data-id="${t.id}" aria-label="Nach unten"${i === len - 1 ? ' disabled' : ''}>${ICON.down}</button>
      </div>
      ${foot ? `<div class="slot-foot">${foot}</div>` : ''}
      ${isOpen ? `<div class="slot-more">${editorHTML(t)}</div>` : ''}
    </li>`;
  }

  function vPlan() {
    const tk = today();
    if (!ui.day) ui.day = tk;
    if (!ui.strip) ui.strip = tk;
    const days = Array.from({ length: 7 }, (_, i) => addDays(ui.strip, i)), c = cap();
    const chips = days.map(k => {
      const n = dayTasks(k).length, d = parseKey(k);
      const dots = n > c ? `<span class="ld-n">${n}</span>` : Array.from({ length: c }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
      return `<button class="daychip${k === tk ? ' is-today' : ''}${k < tk ? ' is-past' : ''}" type="button" data-a="day" data-day="${k}" aria-pressed="${k === ui.day}" aria-label="${esc(dayLabel(k))}: ${n} von ${c}">
        <span class="wd">${WD[d.getDay()]}</span><span class="dn">${d.getDate()}</span><span class="ld" aria-hidden="true">${dots}</span>
      </button>`;
    }).join('');

    const list = dayTasks(ui.day), isToday = ui.day === tk, past = ui.day < tk;
    const od = isToday ? overdue() : [];
    const slots = list.map((t, i) => slotHTML(t, i, list.length, isToday));
    if (!past) {
      for (let i = list.length; i < c; i++) {
        slots.push(`<li class="slot slot-empty">
          <span class="slot-num" aria-hidden="true">${i + 1}</span>
          <div class="slot-body">${i === list.length ? `
            <form class="field" data-f="day-add">
              <input class="input" id="in-day-add" placeholder="Was steht an?" autocomplete="off" aria-label="Neue Aufgabe für ${esc(dayLabel(ui.day))}">
              <button class="btn" type="submit">Dazu</button>
            </form>
            ${inbox().length ? `<button class="link" type="button" data-a="tab" data-tab="kopf">Aus „Kopf leeren“ holen (${inbox().length})</button>` : ''}`
            : '<p class="free">frei</p>'}
          </div>
        </li>`);
      }
    }
    const dt = doneOn(ui.day);
    return `<div class="stack">
      <header class="view-head">
        <p class="eyebrow">${Q('Quest-Plan', 'Dein Plan')}</p>
        <h2 class="h-view">Plan</h2>
        <p class="sub">Höchstens ${c} ${c === 1 ? 'Sache' : 'Sachen'} pro Tag. Tipp auf einen Tag, dann trag ein, was ansteht. Oben steht, was zuerst dran ist.</p>
      </header>
      <div class="block">
        <div class="strip" role="group" aria-label="Woche">
          <button class="icon-btn" type="button" data-a="strip" data-n="-7" aria-label="Eine Woche zurück">${ICON.left}</button>
          ${chips}
          <button class="icon-btn" type="button" data-a="strip" data-n="7" aria-label="Eine Woche vor">${ICON.right}</button>
        </div>
        <div class="row strip-foot">
          ${ui.day !== tk ? `<button class="link" type="button" data-a="day" data-day="${tk}">Zurück zu heute</button>` : '<span></span>'}
          <label class="pick"><span class="hint">Anderer Tag</span><input class="input input-sm" type="date" id="pick-day" data-bound value="${ui.day}"></label>
        </div>
      </div>
      ${od.length ? `<section class="block" aria-labelledby="h-od">
        <h3 class="h-sec" id="h-od">Noch offen von früher</h3>
        <p class="hint">Kein Problem. Hol es auf heute oder gib ihm einen neuen Tag.</p>
        <ul class="od-list">${od.map(t => `<li class="od-item">
          <div class="od-main"><span class="od-t">${esc(t.title)}</span><span class="hint">${esc(shortDay(t.date))}</span></div>
          <div class="row">
            <button class="btn btn-sm" type="button" data-a="to-day" data-id="${t.id}" data-day="${tk}">Auf heute</button>
            <button class="btn btn-quiet btn-sm" type="button" data-a="open" data-id="${t.id}" aria-expanded="${ui.open === t.id}">Neuer Tag …</button>
          </div>
          ${ui.open === t.id ? `<div class="slot-more">${editorHTML(t)}</div>` : ''}
        </li>`).join('')}</ul>
      </section>` : ''}
      <section class="block" aria-labelledby="h-day">
        <div class="day-head"><h3 class="h-sec" id="h-day">${esc(dayLabel(ui.day))}</h3><span class="r-count">${list.length}/${c}</span></div>
        ${past && !list.length ? '<p class="hint">An diesem Tag ist nichts mehr offen.</p>' : `<ol class="slots">${slots.join('')}</ol>`}
      </section>
      ${dt.length ? `<section class="block" aria-labelledby="h-done">
        <h3 class="h-sec" id="h-done">Abgeschlossen <span class="count">${dt.length}</span></h3>
        <ul class="done-list">${dt.slice().reverse().map(x => `<li><span class="d" aria-hidden="true"></span><span class="t">${esc(x.title)}</span><time>${hhmm(x.at)}</time></li>`).join('')}</ul>
      </section>` : ''}
    </div>`;
  }

  function vRoutinen() {
    const cards = S.routines.map((r, idx) => {
      const ids = rDone(r), editing = ui.editR === r.id;
      const dn = r.steps.filter(s => ids.includes(s.id)).length;
      const next = r.steps.find(s => !ids.includes(s.id));
      return `<article class="panel routine">
        <div class="r-head"><h3 class="r-name">${esc(r.name)}</h3><span class="r-count">${r.time ? `${ICON.bell} ${r.time} · ` : ''}${dn}/${r.steps.length}</span></div>
        ${r.steps.length ? `<div class="segs" aria-hidden="true">${r.steps.map(s => `<span class="seg${ids.includes(s.id) ? ' on' : ''}"></span>`).join('')}</div>` : ''}
        ${!editing && next ? `<div class="r-next">
          <p class="lbl">Als Nächstes</p>
          <p class="step-big"><mark>${esc(next.t)}</mark></p>
          <button class="btn" type="button" data-a="r-toggle" data-id="${r.id}" data-sid="${next.id}">${ICON.check} Erledigt</button>
        </div>` : ''}
        ${!editing && !next && r.steps.length ? '<p class="r-done">Für heute erledigt</p>' : ''}
        ${!r.steps.length && !editing ? '<p class="hint">Noch keine Schritte. Tipp auf „Bearbeiten“.</p>' : ''}
        ${r.steps.length ? `<ul class="steps">${r.steps.map(s => {
          const on = ids.includes(s.id);
          return `<li class="step${on && !editing ? ' is-done' : ''}">
            ${editing ? '' : `<button class="check" type="button" role="checkbox" aria-checked="${on}" aria-label="${esc(s.t)}" data-a="r-toggle" data-id="${r.id}" data-sid="${s.id}"><span class="box">${ICON.check}</span></button>`}
            <span class="step-text">${esc(s.t)}</span>
            ${editing ? `<button class="icon-btn" type="button" data-a="r-del-step" data-id="${r.id}" data-sid="${s.id}" aria-label="Schritt löschen">${ICON.x}</button>` : ''}
          </li>`;
        }).join('')}</ul>` : ''}
        ${editing ? `
          <form class="field" data-f="r-step" data-id="${r.id}">
            <input class="input" id="in-rs-${r.id}" placeholder="Neuer Schritt" autocomplete="off" aria-label="Neuer Schritt">
            <button class="btn" type="submit">Dazu</button>
          </form>
          <form class="block" data-f="r-save" data-id="${r.id}">
            <div class="edit-grid">
              <div class="fld"><label class="lbl" for="rr-name-${r.id}">Name</label><input class="input" id="rr-name-${r.id}" value="${esc(r.name)}" autocomplete="off"></div>
              <div class="fld"><label class="lbl" for="rr-time-${r.id}">Erinnern um</label><input class="input" type="time" id="rr-time-${r.id}" value="${r.time}"></div>
            </div>
            <div class="row">
              <button class="btn btn-solid btn-sm" type="submit">Speichern</button>
              <button class="btn btn-quiet btn-sm" type="button" data-a="r-edit" data-id="${r.id}">Fertig</button>
              <button class="icon-btn" type="button" data-a="r-up" data-id="${r.id}" aria-label="Routine nach oben"${idx === 0 ? ' disabled' : ''}>${ICON.up}</button>
              <button class="icon-btn" type="button" data-a="r-down" data-id="${r.id}" aria-label="Routine nach unten"${idx === S.routines.length - 1 ? ' disabled' : ''}>${ICON.down}</button>
              <button class="btn btn-danger btn-sm" type="button" data-a="r-del" data-id="${r.id}">Löschen</button>
            </div>
          </form>`
        : `<div class="row">
            <button class="link" type="button" data-a="r-edit" data-id="${r.id}">Bearbeiten</button>
            ${dn ? `<button class="link" type="button" data-a="r-reset" data-id="${r.id}">Zurücksetzen</button>` : ''}
          </div>`}
      </article>`;
    }).join('');
    return `<div class="stack">
      <header class="view-head">
        <p class="eyebrow">${Q('Tägliche Quests', 'Jeden Tag')}</p>
        <h2 class="h-view">Routinen</h2>
        <p class="sub">Jeden Tag gleich, damit du nicht nachdenken musst. Um Mitternacht hakt sich alles von selbst zurück.</p>
      </header>
      ${cards || `<div class="empty">
        <strong>Noch keine Routine</strong>
        <p>Starte mit einer Vorlage für morgens und abends. Du kannst danach jeden Schritt ändern.</p>
        <button class="btn btn-solid" type="button" data-a="r-templates">Vorlagen anlegen</button>
      </div>`}
      <form class="block" data-f="r-add">
        <label class="lbl" for="in-r-new">Neue Routine</label>
        <div class="field">
          <input class="input" id="in-r-new" placeholder="z. B. Nach der Arbeit" autocomplete="off">
          <button class="btn" type="submit">Anlegen</button>
        </div>
      </form>
    </div>`;
  }

  function vKopf() {
    const items = inbox(), tk = today(), tm = addDays(tk, 1);
    return `<div class="stack">
      <header class="view-head">
        <p class="eyebrow">${Q('Gedankenspeicher', 'Alles raus')}</p>
        <h2 class="h-view">Kopf leeren</h2>
        <p class="sub">Alles raus, was dir durch den Kopf geht. Nicht sortieren, nicht bewerten. Mit „Einplanen“ gibst du einer Sache einen Tag.</p>
      </header>
      <form class="block" data-f="dump">
        <div class="field">
          <textarea class="input" id="in-dump" rows="1" data-enter placeholder="Was geht dir durch den Kopf?" aria-label="Gedanke oder Aufgabe"></textarea>
          <button class="btn btn-solid" type="submit">Rein damit</button>
        </div>
        <p class="hint">Mehrere Zeilen auf einmal einfügen geht auch. Jede Zeile wird ein Eintrag.</p>
      </form>
      ${items.length ? `<ul class="dump-list">${items.slice().reverse().map(t => `
        <li class="dump-item">
          <span class="dump-text">${esc(t.title)}</span>
          <button class="btn btn-sm" type="button" data-a="plan-open" data-id="${t.id}" aria-expanded="${ui.planFor === t.id}">Einplanen</button>
          <button class="icon-btn" type="button" data-a="del-task" data-id="${t.id}" aria-label="${esc(t.title)} löschen">${ICON.x}</button>
          ${ui.planFor === t.id ? `<div class="plan-pick">
            <button class="btn btn-sm" type="button" data-a="to-day" data-id="${t.id}" data-day="${tk}"${isFull(tk) ? ' disabled' : ''}>Heute${isFull(tk) ? ' (voll)' : ''}</button>
            <button class="btn btn-sm" type="button" data-a="to-day" data-id="${t.id}" data-day="${tm}"${isFull(tm) ? ' disabled' : ''}>Morgen${isFull(tm) ? ' (voll)' : ''}</button>
            <form class="field" data-f="plan-date" data-id="${t.id}">
              <input class="input input-sm" type="date" id="pd-${t.id}" min="${tk}" aria-label="Tag wählen">
              <button class="btn btn-sm" type="submit">OK</button>
            </form>
          </div>` : ''}
        </li>`).join('')}</ul>`
      : `<div class="empty"><strong>Dein Kopf ist leer</strong><p>Wenn dir etwas einfällt, schreib es oben rein. Hier geht nichts verloren.</p></div>`}
    </div>`;
  }

  function vSettings() {
    const st = S.settings, look = LOOKS[st.look];
    Object.keys(FONTS).forEach(ensureFont);
    const pressed = b => `aria-pressed="${b}"`;
    const toggle = (k, name, hint) => `<div class="tg"><div><p class="tg-name">${name}</p>${hint ? `<p class="hint">${hint}</p>` : ''}</div>
      <button class="switch" type="button" role="switch" aria-checked="${!!st[k]}" aria-label="${name}" data-a="toggle" data-k="${k}"></button></div>`;
    const examples = S.tasks.filter(t => /^Beispiel:/.test(t.title)).length;
    return `<div class="stack">
      <header class="view-head">
        <p class="eyebrow">Einstellungen</p>
        <h2 class="h-view">So, wie es für dich passt</h2>
        <p class="sub">Alles hier wird sofort übernommen und auf deinen Geräten gespeichert.</p>
      </header>

      <section class="panel panel-quiet set-sec" aria-labelledby="h-look">
        <h3 class="h-sec" id="h-look">Aussehen</h3>
        <div class="set-row"><p class="lbl">Design</p>
          <div class="looks">${Object.entries(LOOKS).map(([k, l]) => `<button class="look" type="button" data-a="set" data-k="look" data-v="${k}" ${pressed(st.look === k)}>
            <span class="pv" style="background:${l.sw[0]}"><span style="background:${l.sw[1]}"></span><i style="background:${l.sw[2]}"></i></span>${l.name}</button>`).join('')}</div>
        </div>
        <div class="set-row"><p class="lbl">Farbe</p>
          <div class="swatches">
            <button class="opt" type="button" data-a="set" data-k="accent" data-v="" ${pressed(st.accent === '')}>Passend</button>
            ${Object.entries(ACCENTS).map(([k, a]) => `<button class="sw" type="button" data-a="set" data-k="accent" data-v="${k}" ${pressed(st.accent === k)} aria-label="${a.name}" title="${a.name}" style="background:${look.dark ? a.dark : a.light}"></button>`).join('')}
          </div>
        </div>
        <div class="set-row"><p class="lbl">Schrift</p>
          <div class="opts">${Object.entries(FONTS).map(([k, f]) => `<button class="opt" type="button" data-a="set" data-k="font" data-v="${k}" ${pressed(st.font === k)} style="font-family:${esc(f.fam)}">${f.name}<small>${f.note}</small></button>`).join('')}</div>
        </div>
        <div class="set-row"><p class="lbl">Schriftgröße</p>
          <div class="opts">${Object.entries(SIZES).map(([k, s]) => `<button class="opt" type="button" data-a="set" data-k="size" data-v="${k}" ${pressed(st.size === k)} style="font-size:${s.px}px">${s.name}</button>`).join('')}</div>
        </div>
        ${toggle('glow', 'Leuchten', 'Leuchtende Rahmen und Schrift. Aus ist ruhiger.')}
        ${toggle('motion', 'Animationen', 'Funkeln beim Abhaken und sanfte Übergänge.')}
        ${toggle('quest', 'Spiel-Sprache', 'Wörter wie „Quest“ und „Speicherpunkt“. Aus heißt: ganz normale Wörter.')}
      </section>

      <section class="panel panel-quiet set-sec" aria-labelledby="h-plan">
        <h3 class="h-sec" id="h-plan">Planung</h3>
        <div class="set-row"><p class="lbl">Aufgaben pro Tag</p>
          <div class="stepper">
            <button class="btn btn-sm" type="button" data-a="set" data-k="maxPerDay" data-v="${st.maxPerDay - 1}"${st.maxPerDay <= 1 ? ' disabled' : ''} aria-label="Weniger">−</button>
            <output aria-live="polite">${st.maxPerDay}</output>
            <button class="btn btn-sm" type="button" data-a="set" data-k="maxPerDay" data-v="${st.maxPerDay + 1}"${st.maxPerDay >= 5 ? ' disabled' : ''} aria-label="Mehr">+</button>
          </div>
          <p class="hint">Weniger ist mehr. Drei schaffbare Sachen sind besser als zehn halbe.</p>
        </div>
        <div class="set-row"><p class="lbl">Timer-Startwert</p>
          <div class="opts">${[5, 15, 25, 45].map(m => `<button class="opt" type="button" data-a="set" data-k="timer" data-v="${m}" ${pressed(st.timer === m)}>${m} Min</button>`).join('')}</div>
        </div>
        <div class="set-row"><p class="lbl">Automatische Mini-Schritte</p>
          <div class="opts">
            <button class="opt" type="button" data-a="set" data-k="stepSize" data-v="s" ${pressed(st.stepSize === 's')}>Klein<small>3 bis 6 Schritte</small></button>
            <button class="opt" type="button" data-a="set" data-k="stepSize" data-v="xs" ${pressed(st.stepSize === 'xs')}>Sehr klein<small>5 bis 9 Schritte</small></button>
          </div>
        </div>
      </section>

      <section class="panel panel-quiet set-sec" aria-labelledby="h-rem">
        <h3 class="h-sec" id="h-rem">Erinnerungen</h3>
        <div class="set-row"><label class="lbl" for="set-rem">Standard für neue Aufgaben</label>
          <select class="input" id="set-rem" data-bound data-k="remindDefault">${REMINDS.map(([v, l]) => `<option value="${v}"${v === st.remindDefault ? ' selected' : ''}>${l}</option>`).join('')}</select>
        </div>
        ${toggle('briefOn', 'Tagesüberblick', 'Einmal am Tag: Was heute ansteht.')}
        ${st.briefOn ? `<div class="set-row"><label class="lbl" for="set-brief">Uhrzeit für den Tagesüberblick</label><input class="input" type="time" id="set-brief" data-bound data-k="briefTime" value="${st.briefTime}"></div>` : ''}
        ${toggle('sound', 'Ton', 'Ein kurzer Gong bei Erinnerung und Timer-Ende.')}
        ${toggle('vibrate', 'Vibration', 'Nur auf Geräten, die das können.')}
        <div class="row"><button class="btn btn-sm" type="button" data-a="test-remind">${ICON.bell} Erinnerung testen</button></div>
        <p class="note">Erinnerungen kommen, solange der Planer offen ist, am Handy oder am Computer. Damit dich dein Handy auch bei geschlossenem Planer erinnert, öffne eine Aufgabe mit Uhrzeit und tipp auf „In Google Kalender eintragen“.</p>
      </section>

      <section class="panel panel-quiet set-sec" aria-labelledby="h-data">
        <h3 class="h-sec" id="h-data">Daten</h3>
        ${examples ? `<div class="row"><button class="btn btn-sm" type="button" data-a="del-examples">Beispiele entfernen (${examples})</button></div>` : ''}
        ${ui.wipe ? `<div class="block"><p>Wirklich alles löschen? Aufgaben, Routinen und Erledigtes sind dann weg. Deine Einstellungen bleiben.</p>
          <div class="row"><button class="btn btn-danger btn-sm" type="button" data-a="wipe-yes">Ja, alles löschen</button><button class="btn btn-quiet btn-sm" type="button" data-a="wipe-no">Abbrechen</button></div></div>`
        : `<div class="row"><button class="btn btn-danger btn-sm" type="button" data-a="wipe">Alles löschen …</button></div>`}
      </section>
    </div>`;
  }

  const VIEWS = { jetzt: vJetzt, plan: vPlan, routinen: vRoutinen, kopf: vKopf, settings: vSettings };

  function renderTabs() {
    const h = dayTasks(today()).length, k = inbox().length;
    const rLeft = S.routines.reduce((n, r) => n + r.steps.filter(s => !rDone(r).includes(s.id)).length, 0);
    document.querySelectorAll('.tab').forEach(b => {
      const tab = b.dataset.tab, badge = b.querySelector('.badge');
      b.setAttribute('aria-current', tab === ui.tab ? 'page' : 'false');
      let txt = '', live = false;
      if (tab === 'jetzt' && S.activeId) live = true;
      if (tab === 'plan' && h) txt = `${h}/${cap()}`;
      if (tab === 'routinen' && rLeft) txt = String(rLeft);
      if (tab === 'kopf' && k) txt = String(k);
      badge.className = 'badge' + (live ? ' live' : '');
      badge.textContent = live ? '' : txt;
      badge.hidden = !live && !txt;
    });
    $('#gear').setAttribute('aria-current', ui.tab === 'settings' ? 'page' : 'false');
  }

  function render() {
    applySettings();
    const view = $('#view');
    const vals = {};
    view.querySelectorAll('input[id], textarea[id], select[id]').forEach(el => { if (!el.hasAttribute('data-bound')) vals[el.id] = el.value; });
    const ae = document.activeElement;
    const fid = ae && view.contains(ae) ? ae.id : null;
    let sel = null;
    try { if (fid && typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { /* kein Textfeld */ }

    view.innerHTML = VIEWS[ui.tab]();

    for (const [id, v] of Object.entries(vals)) {
      const el = document.getElementById(id);
      if (el && !el.hasAttribute('data-bound')) { el.value = v; if (el.tagName === 'TEXTAREA') grow(el); }
    }
    if (fid) {
      const el = document.getElementById(fid);
      if (el) {
        el.focus({ preventScroll: true });
        if (sel) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* kein Textfeld */ } }
      }
    }
    $('#date').textContent = fmtLong(today());
    renderTabs();
    paintTimer();
    paintSync();
  }

  /* ---------- Meldungen & Feier ---------- */
  let toastTimer = null, toastAct = null;
  function toast(msg, act) {
    const el = $('#toast');
    el.innerHTML = `<span>${esc(msg)}</span>${act ? `<button type="button" data-a="toast-act">${esc(act.label)}</button>` : ''}`;
    toastAct = act ? act.run : null;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; toastAct = null; }, act ? 7000 : 3400);
  }
  function burst() {
    if (!S.settings.motion) return;
    try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) { /* weiter */ }
    const box = document.createElement('div');
    box.className = 'burst';
    const cols = ['var(--line)', 'var(--ink)', 'var(--gold)', 'var(--line)'];
    for (let i = 0; i < 26; i++) {
      const p = document.createElement('i');
      p.style.setProperty('--x', ((Math.random() * 2 - 1) * 170).toFixed(0) + 'px');
      p.style.setProperty('--y', (-(70 + Math.random() * 170)).toFixed(0) + 'px');
      p.style.setProperty('--r', (Math.random() * 540 - 270).toFixed(0) + 'deg');
      p.style.background = cols[i % cols.length];
      p.style.animationDelay = (Math.random() * 90).toFixed(0) + 'ms';
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 1500);
  }
  function grow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }

  /* ---------- Ereignisse ---------- */
  document.addEventListener('pointerdown', () => { if (!ac || ac.state !== 'running') unlockAudio(); }, { passive: true });

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    const { a, id, sid, tab, min, day, k, v, n } = b.dataset;
    switch (a) {
      case 'tab':
        if (ui.tab !== tab) { ui.tab = tab; ui.win = null; ui.parking = false; ui.wipe = false; render(); window.scrollTo(0, 0); }
        break;
      case 'start': start(id); break;
      case 'start5': start(id, 5); break;
      case 'finish': finish(); break;
      case 'park-open': ui.parking = !ui.parking; render(); if (ui.parking) setTimeout(() => $('#in-park')?.focus(), 0); break;
      case 'park-cancel': ui.parking = false; render(); break;
      case 'stepdone': nextStepDone(id); break;
      case 'toggle-step': toggleStep(id, sid); break;
      case 'del-step': delStep(id, sid); break;
      case 'clear-note': clearNote(id); break;
      case 'open': ui.open = ui.open === id ? null : id; render(); break;
      case 'up': move(id, -1); break;
      case 'down': move(id, 1); break;
      case 'day': showDay(day); ui.open = null; render(); break;
      case 'strip': ui.strip = addDays(ui.strip || today(), Number(n)); ui.day = ui.strip < today() && addDays(ui.strip, 6) >= today() ? today() : ui.strip; ui.open = null; render(); break;
      case 'to-day': schedule(id, day); break;
      case 'unplan': ui.open = null; schedule(id, ''); break;
      case 'plan-open': ui.planFor = ui.planFor === id ? null : id; render(); break;
      case 'del-task': delTask(id); break;
      case 'done-direct': doneDirect(id); break;
      case 'ai': aiSplit(id); break;
      case 'ai-stop': if (ai.ctl) ai.ctl.abort(); break;
      case 't-set': tSet(Number(min)); render(); break;
      case 't-start': tStart(); render(); break;
      case 't-pause': tPause(); render(); break;
      case 't-add5': tAdd5(); render(); break;
      case 'r-templates': templates(); break;
      case 'r-toggle': rToggle(id, sid); break;
      case 'r-reset': rReset(id); break;
      case 'r-edit': ui.editR = ui.editR === id ? null : id; render(); break;
      case 'r-del': rDel(id); break;
      case 'r-del-step': rDelStep(id, sid); break;
      case 'r-up': rMove(id, -1); break;
      case 'r-down': rMove(id, 1); break;
      case 'set': setSetting(k, (k === 'maxPerDay' || k === 'timer') ? Number(v) : v); break;
      case 'toggle': setSetting(k, !S.settings[k]); break;
      case 'test-remind':
        unlockAudio();
        ui.remind = { key: 'test', kind: 'test', title: 'So sieht eine Erinnerung aus', body: 'Mit Ton und Vibration, wenn du das eingeschaltet hast.' };
        paintRemind();
        setTimeout(alertOut, 120);
        break;
      case 'rm-ok': closeRemind(true); break;
      case 'rm-snooze':
        if (ui.remind && ui.remind.key !== 'test') snoozed[ui.remind.key] = Date.now() + 5 * 60000;
        closeRemind(false);
        toast('Ich erinnere dich in 5 Minuten nochmal.');
        break;
      case 'rm-go': remindGo(); break;
      case 'del-examples': {
        const done = undoable();
        S.tasks = S.tasks.filter(t => !/^Beispiel:/.test(t.title));
        if (S.activeId && !byId(S.activeId)) S.activeId = null;
        commit();
        done('Beispiele entfernt.');
        break;
      }
      case 'wipe': ui.wipe = true; render(); break;
      case 'wipe-no': ui.wipe = false; render(); break;
      case 'wipe-yes': {
        const done = undoable();
        const keep = S.settings;
        S = blank();
        S.settings = keep;
        ui.wipe = false;
        ui.open = null;
        commit();
        done('Alles gelöscht.');
        break;
      }
      case 'toast-act': {
        const fn = toastAct;
        $('#toast').hidden = true;
        toastAct = null;
        if (fn) fn();
        break;
      }
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'pick-day' && isDate(el.value)) { showDay(el.value); ui.open = null; render(); return; }
    if (el.dataset && el.dataset.k && el.matches('select, input')) {
      const k = el.dataset.k;
      if (k === 'remindDefault') setSetting(k, Number(el.value));
      else if (k === 'briefTime' && isTime(el.value)) setSetting(k, el.value);
    }
  });

  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-f]');
    if (!f) return;
    e.preventDefault();
    const kind = f.dataset.f, id = f.dataset.id;
    if (kind === 'edit') { saveEdit(id); return; }
    if (kind === 'r-save') { rSave(id); return; }
    const inp = f.querySelector('input, textarea');
    const raw = inp ? inp.value : '';
    const v = raw.trim();
    if (!v && kind !== 'park') { if (inp) inp.focus(); return; }
    if (inp) { inp.value = ''; if (inp.tagName === 'TEXTAREA') grow(inp); }
    switch (kind) {
      case 'dump': addTasks(raw, ''); break;
      case 'capture': addTasks(v, ''); break;
      case 'idle-add': ui.win = null; addTasks(v, today()); break;
      case 'day-add': addTasks(v, ui.day || today(), true); break;
      case 'step': addSteps(id, raw); break;
      case 'park': park(v); break;
      case 'plan-date': if (isDate(v)) schedule(id, v); break;
      case 'r-add': rAdd(v); break;
      case 'r-step': rAddStep(id, raw); break;
    }
  });

  document.addEventListener('keydown', e => {
    const t = e.target;
    if (t.matches && t.matches('textarea[data-enter]') && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      t.form.requestSubmit();
    }
  });
  document.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA') grow(e.target); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });

  /* ---------- Start ---------- */
  const local = loadLocal();
  if (local) S = local;
  if (T.endsAt) { if (tLeft() > 0) startTick(); else { T.endsAt = null; T.left = 0; saveT(); } }
  render();
  connect().catch(() => setSync('local'));
  setTimeout(checkReminders, 2500);
  setInterval(checkReminders, 15000);

  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
})();
</script>
