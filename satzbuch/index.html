<title>Satzbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ein liniertes Notizblatt in einer schmalen Spalte mit rotem Randstrich. Oben die Seite von heute, darunter frühere Seiten nach Kalenderwoche. Einziges Bedienelement ist der Aufnahmeknopf unten in der Mitte. */
:root {
  --paper: #fcfcfa;
  --ink: #1c222b;
  --ink-2: #4f5866;
  --muted: #8a929f;
  --rule: #d9e3ef;
  --margin: #eaa3a0;
  --accent: #2756b0;
  --rec: #d13a31;
  --rec-ink: #ffffff;
  --up: #15804a;
  --down: #b24a1e;
  --soft: #f0f3f7;
  --toast-bg: #1c222b;
  --toast-ink: #ffffff;
  --toast-act: #9fbcff;
  --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14171c; --ink: #e4e8ee; --ink-2: #aab3bf; --muted: #7d8692; --rule: #272e38; --margin: #7c3b39;
    --accent: #86a9ff; --rec: #ff5b50; --rec-ink: #1a0806; --up: #57c98f; --down: #ef8c60; --soft: #1d222a;
    --toast-bg: #e4e8ee; --toast-ink: #14171c; --toast-act: #2756b0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14171c; --ink: #e4e8ee; --ink-2: #aab3bf; --muted: #7d8692; --rule: #272e38; --margin: #7c3b39;
  --accent: #86a9ff; --rec: #ff5b50; --rec-ink: #1a0806; --up: #57c98f; --down: #ef8c60; --soft: #1d222a;
  --toast-bg: #e4e8ee; --toast-ink: #14171c; --toast-act: #2756b0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 200px;
}
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.head h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.head nav { display: flex; gap: 18px; }
.head nav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14.5px; padding: 4px 0; }
.head nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }

.note-banner { margin-top: 14px; font-size: 13.5px; color: var(--ink-2); background: var(--soft); border-radius: 8px; padding: 8px 11px; }

.ph { margin-top: 26px; }
.ph h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
.ph .sub { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 6px; font-size: 13.5px; color: var(--muted); }
.ph .kw { font-family: var(--mono); }
.dayb { background: none; border: 0; padding: 2px 0; color: var(--muted); font-weight: 500; }
.dayb[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.hint { margin: 12px 0 0; font-size: 13.5px; color: var(--ink-2); max-width: 60ch; }
.hint q { font-style: italic; quotes: "„" "“"; }
.hint a { color: var(--accent); font-weight: 500; }

.pad { position: relative; list-style: none; margin: 14px 0 0; padding: 0 0 0 40px; border-top: 1px solid var(--rule); }
.pad::before { content: ""; position: absolute; top: 0; bottom: 0; left: 28px; width: 1.5px; background: var(--margin); }
.line {
  position: relative; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 2px;
  min-height: 44px; padding: 11px 0 9px; border-bottom: 1px solid var(--rule);
}
button.line { width: 100%; text-align: left; background: none; border-width: 0 0 1px; border-style: solid; border-color: var(--rule); border-radius: 0; }
.line.sel { background: var(--soft); }
.line.act { align-items: center; padding-block: 6px; }
.line.act .sub-row { flex: 1 1 auto; flex-basis: auto; justify-content: flex-start; }
.mk { position: absolute; left: -34px; width: 22px; text-align: center; font-weight: 600; }
.mk.done { color: var(--up); }
.mk.next { color: var(--accent); }
.nm { flex: 1 1 8rem; min-width: 0; font-weight: 500; font-size: 15.5px; overflow-wrap: anywhere; }
.sc { font-family: var(--mono); font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.vals { margin-left: auto; text-align: right; font-family: var(--mono); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.vals.open { color: var(--muted); font-weight: 400; }
.d { font-family: var(--mono); font-size: 12.5px; margin-left: 6px; }
.d.up { color: var(--up); }
.d.down { color: var(--down); }
.sub-row { flex-basis: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 12.5px; color: var(--muted); }
.sub-row .num { font-family: var(--mono); }
.sub-row i { color: var(--ink-2); }
.strike { margin-left: auto; color: var(--rec); font-weight: 600; font-size: 13px; background: none; border: 0; padding: 6px 0; }
.line.live { color: var(--ink-2); font-style: italic; }
.line.live .st { flex-basis: 100%; font-style: normal; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--rec); }
.line.live .st.busy { color: var(--accent); }
.line.live .p { color: var(--muted); }
.caret { display: inline-block; width: 1.5px; height: 1em; background: var(--rec); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.days-plan h3 { margin: 26px 0 0; font-size: 15px; font-weight: 600; }
.empty-line { color: var(--muted); font-style: italic; }
.loading { margin-top: 26px; color: var(--muted); }

.hist { margin-top: 44px; }
.hist > h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.wk-h { margin: 22px 0 0; font-size: 14px; font-weight: 600; color: var(--ink-2); font-family: var(--mono); }
.sess-h { margin: 14px 0 0; font-size: 14px; font-weight: 600; }
.sess-h span { color: var(--muted); font-weight: 400; }
.hist .pad { margin-top: 6px; }
.hist .line { min-height: 38px; padding: 8px 0 6px; }
.hist .nm { font-size: 14.5px; }
.hist .vals { font-size: 14px; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 30px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--paper) 64%, transparent);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.dock > * { pointer-events: auto; }
.mic {
  width: 68px; height: 68px; border-radius: 50%; border: 0;
  background: var(--rec); color: var(--rec-ink); display: grid; place-items: center;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--rec) 30%, transparent);
}
.mic svg { width: 28px; height: 28px; }
.mic .sq { display: none; width: 20px; height: 20px; border-radius: 4px; background: var(--rec-ink); }
.mic.on .sq { display: block; }
.mic.on svg { display: none; }
.mic.on { animation: pulse 1.4s ease-in-out infinite; }
.mic:disabled { opacity: .55; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rec) 45%, transparent); } 50% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--rec) 0%, transparent); } }
@media (prefers-reduced-motion: reduce) { .mic.on { animation: none; outline: 3px solid var(--rec); outline-offset: 3px; } .caret { animation: none; } }
.mic-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }

.fb { width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: 13px; color: var(--ink-2); }
.fb .linkish { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px 2px; }
.fb form { width: 100%; display: flex; gap: 8px; }
.fb input { flex: 1 1 auto; min-width: 0; background: var(--soft); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.fb form button { flex: 0 0 auto; border: 0; border-radius: 10px; padding: 0 14px; background: var(--ink); color: var(--paper); font-weight: 600; }
.fb form button:disabled { opacity: .5; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(150px + env(safe-area-inset-bottom, 0px));
  width: min(520px, calc(100% - 32px));
  background: var(--toast-bg); color: var(--toast-ink); border-radius: 10px; padding: 10px 14px;
  display: flex; align-items: center; gap: 12px; font-size: 14px;
}
.toast span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.toast button { background: none; border: 0; color: var(--toast-act); font-weight: 600; padding: 4px 2px; }
</style>

<div class="wrap">
  <header class="head">
    <h1>Satzbuch</h1>
    <nav aria-label="Seiten">
      <a href="#notizen" id="tab-notizen">Notizen</a>
      <a href="#plan" id="tab-plan">Plan</a>
    </nav>
  </header>
  <div id="banner"></div>
  <main id="v-notizen"></main>
  <main id="v-plan" hidden></main>
</div>

<div class="dock" id="dock">
  <button class="mic" id="mic" type="button" aria-label="Sprachnotiz aufnehmen" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
    <span class="sq" aria-hidden="true"></span>
  </button>
  <div class="mic-label" id="mic-label" hidden>Sprachnotiz</div>
  <div class="fb" id="fb" hidden>
    <div id="fb-text">Aufnehmen geht hier nicht. Öffne das Satzbuch in Chrome, Edge oder der Claude-App am Computer.</div>
    <button class="linkish" type="button" id="fb-open">Stattdessen mit dem Tastatur-Mikrofon diktieren</button>
    <form id="fb-form" hidden>
      <input id="fb-input" type="text" autocomplete="off" enterkeyhint="done" placeholder="Mikrofon der Tastatur antippen und sprechen" aria-label="Sprachnotiz über die Tastatur diktieren">
      <button type="submit" id="fb-send">Fertig</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo" hidden>Rückgängig</button></div>

<script>
(() => {
"use strict";

/* ---------- Hilfen ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad2 = (n) => String(n).padStart(2, "0");
const isoDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => isoDate(new Date());
const WDL = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const MONL = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const MON = ["Jan.", "Feb.", "März", "Apr.", "Mai", "Juni", "Juli", "Aug.", "Sep.", "Okt.", "Nov.", "Dez."];
const longDate = (s) => { const d = parseDate(s); return `${WDL[d.getDay()]}, ${d.getDate()}. ${MONL[d.getMonth()]}`; };
const shortDate = (s) => { const d = parseDate(s); return `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`; };
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  return Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7);
}
function weekStart(s) { const d = parseDate(s); const day = d.getDay() || 7; d.setDate(d.getDate() - day + 1); return d; }
const norm = (s) => String(s || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9]/g, "");
const slug = (s) => String(s || "").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "tag";
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const clone = (o) => o == null ? null : JSON.parse(JSON.stringify(o));
const uid = () => Math.random().toString(36).slice(2, 10);
const fmtKg = (v) => v == null ? "–" : String(Math.round(v * 100) / 100).replace(".", ",");
function setsText(sets) {
  if (!sets || !sets.length) return "";
  if (sets.every((x) => x.kg == null)) return `${sets.map((x) => x.reps ?? "–").join(" · ")} Wdh.`;
  const same = sets.every((x) => x.reps === sets[0].reps);
  return same ? `${sets.map((x) => fmtKg(x.kg)).join(" · ")} kg` : sets.map((x) => `${fmtKg(x.kg)}×${x.reps ?? "–"}`).join(" · ");
}
const topKg = (e) => { const v = (e.sets || []).map((s) => s.kg).filter((x) => typeof x === "number"); return v.length ? Math.max(...v) : null; };
const schemeOf = (e) => e.sets ? `${e.sets}×${e.reps ?? "?"}` : (e.reps ? `${e.reps} Wdh.` : "");

function bigrams(s) { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const b = s.slice(i, i + 2); m.set(b, (m.get(b) || 0) + 1); } return m; }
function dice(a, b) {
  if (a.length < 2 || b.length < 2) return a === b ? 1 : 0;
  const A = bigrams(a), B = bigrams(b); let inter = 0;
  for (const [k, v] of A) inter += Math.min(v, B.get(k) || 0);
  return (2 * inter) / (a.length - 1 + b.length - 1);
}
function matchName(spoken, candidates) {
  const n = norm(spoken); if (!n) return null;
  let best = null, score = 0;
  for (const c of candidates) {
    const m = norm(c); if (!m) continue;
    const s = m === n ? 1 : (m.includes(n) || n.includes(m)) ? 0.4 + 0.6 * Math.min(m.length, n.length) / Math.max(m.length, n.length) : dice(m, n);
    if (s > score) { score = s; best = c; }
  }
  return score >= 0.6 ? best : null;
}

/* ---------- Zustand ---------- */
const S = {
  db: null, sample: null, dict: null,
  ready: { plan: false, sessions: false },
  plan: null,
  sessions: new Map(),
  view: "notizen",
  dayId: null,
  picked: null,
  noWrite: false, memoryOnly: false, stale: false, sampleOff: false,
  rec: { on: false, final: "", partial: "", busy: false, noLang: false },
};
const HIDE_SAMPLE = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

const planDays = () => (S.plan && Array.isArray(S.plan.days) ? S.plan.days : []);
const dayById = (id) => planDays().find((d) => d.id === id) || null;
const allPlanNames = () => planDays().flatMap((d) => d.exercises.map((e) => e.name));
function planExercise(name) { const n = norm(name); for (const d of planDays()) for (const e of d.exercises) if (norm(e.name) === n) return e; return null; }
function dayOfExercise(name) { const n = norm(name); return planDays().find((d) => d.exercises.some((e) => norm(e.name) === n)) || null; }
const sessionList = () => [...S.sessions.entries()].map(([id, d]) => ({ id, ...d })).filter((s) => s.date).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
function knownNames() {
  const set = new Set(allPlanNames());
  for (const s of S.sessions.values()) for (const e of s.entries || []) set.add(e.exercise);
  return [...set];
}
function autoDayId() {
  const days = planDays(); if (!days.length) return null;
  const before = sessionList().filter((s) => s.date < today() && dayById(s.dayId));
  if (!before.length) return days[0].id;
  const i = days.findIndex((d) => d.id === before[0].dayId);
  return days[(i + 1) % days.length].id;
}
function currentSession() {
  const id = today();
  const data = S.sessions.get(id) || null;
  const dayId = (S.dayId && dayById(S.dayId)) ? S.dayId : (data && dayById(data.dayId)) ? data.dayId : autoDayId();
  return { id, dayId, data };
}
function lastTimeFor(name, beforeDate) {
  const n = norm(name);
  for (const s of sessionList()) {
    if (s.date >= beforeDate) continue;
    const e = (s.entries || []).find((x) => norm(x.exercise) === n);
    if (e && e.sets && e.sets.length) return { date: s.date, entry: e };
  }
  return null;
}
function nextUp() {
  if (S.picked) { const p = knownNames().find((n) => norm(n) === S.picked); if (p) return p; }
  const cs = currentSession(); const day = dayById(cs.dayId); if (!day) return null;
  const done = new Set(((cs.data && cs.data.entries) || []).map((e) => norm(e.exercise)));
  const nx = day.exercises.find((e) => !done.has(norm(e.name)));
  return nx ? nx.name : null;
}

/* ---------- Speichern ---------- */
const queues = new Map();
function writeDoc(path, body) {
  const prev = queues.get(path) || Promise.resolve();
  const next = prev.catch(() => {}).then(async () => {
    if (!S.db) return;
    const ref = S.db.doc(path);
    if (body === null) await ref.delete(); else await ref.set(body);
  });
  queues.set(path, next);
  return next.catch((e) => {
    if (e && e.code === "invalid_argument") { S.noWrite = true; render(); toast("Speichern ist hier nicht erlaubt. Eintragen kann nur, wem das Satzbuch gehört."); }
    else if (e && e.code === "quota_exceeded") toast("Der Speicher ist voll.");
    else toast("Speichern hat nicht geklappt. Prüf deine Verbindung und sprich die Notiz noch einmal ein.");
    throw e;
  });
}
function putSession(id, body) {
  if (body) S.sessions.set(id, body); else S.sessions.delete(id);
  render();
  return writeDoc(`sessions/${id}`, body);
}
function putPlan(body) {
  S.plan = body; S.dayId = null; S.picked = null;
  render();
  return writeDoc("plan/current", body);
}

/* ---------- Sprachnotiz auswerten: Sätze ---------- */
const NUMW = { eins: 1, zwei: 2, drei: 3, vier: 4, "fünf": 5, sechs: 6, sieben: 7, acht: 8, neun: 9, zehn: 10, elf: 11, "zwölf": 12, dreizehn: 13, vierzehn: 14, "fünfzehn": 15, sechzehn: 16, siebzehn: 17, achtzehn: 18, neunzehn: 19, zwanzig: 20 };
const NUMW_RE = /\b(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf|dreizehn|vierzehn|fünfzehn|sechzehn|siebzehn|achtzehn|neunzehn|zwanzig)\b/g;
const STOP = new Set("kilo kilos kg kilogramm satz sätze runde und dann mit je à a bei jetzt als nächstes nächste übung wiederholungen wiederholung wdh reps alle jeweils das die der den war waren ich habe hab gemacht heute auf für also okay ok ähm äh noch plus bis zu von pro gewicht sätzen".split(" "));
function prep(text) {
  let t = " " + String(text).toLowerCase() + " ";
  t = t.replace(/[–—]/g, " ").replace(NUMW_RE, (w) => String(NUMW[w]));
  t = t.replace(/(\d+)\s*(?:,|komma|punkt)\s*(\d+)/g, "$1.$2").replace(/(\d+)\s*einhalb/g, (m, a) => String(+a + 0.5));
  return t;
}
function localParse(text, hint) {
  let t = prep(text);
  t = t.replace(/\b(?:erste|zweite|dritte|vierte|fünfte|sechste|siebte|achte|letzte)[nrms]?\b(?:\s+(?:satz|runde))?/g, " | ");
  t = t.replace(/\b(?:satz|runde)\s+\d+\b/g, " | ").replace(/\b\d+\.\s*(?:satz|runde)\b/g, " | ");
  t = t.replace(/(\d+)\s*sätze\s*(?:à|a|zu|mit|je|von)?\s*(\d+)/g, " §$1x$2§ ");
  t = t.replace(/(\d+(?:\.\d+)?)\s*(?:x|×|mal)\s*(\d+)/g, (m, a, b) => (+a <= 10 ? ` §${a}x${b}§ ` : ` ${a} kg ${b} wdh `));
  const toks = t.match(/§\d+x\d+§|\d+(?:\.\d+)?|[a-zäöüß]+|\|/g) || [];
  const out = []; let cur = null;
  const fresh = () => ({ words: [], scheme: null, kg: [], reps: {}, note: [] });
  const has = (c) => c && (c.scheme || c.kg.length);
  for (let i = 0; i < toks.length; i++) {
    const k = toks[i];
    if (k === "|") continue;
    if (k[0] === "§") {
      const [a, b] = k.slice(1, -1).split("x").map(Number);
      if (!cur) cur = fresh();
      else if (cur.scheme) { out.push(cur); cur = fresh(); }
      cur.scheme = { sets: a, reps: b };
      continue;
    }
    if (/^\d/.test(k)) {
      const v = +k, nx = toks[i + 1] || "";
      if (!cur) cur = fresh();
      if (/^(wiederholungen|wiederholung|wdh|reps)$/.test(nx)) { cur.reps[Math.max(0, cur.kg.length - 1)] = v; i++; continue; }
      cur.kg.push(v);
      if (/^(kilo|kilos|kg|kilogramm)$/.test(nx)) i++;
      continue;
    }
    if (STOP.has(k)) continue;
    if (has(cur)) {
      const looksName = toks.slice(i + 1, i + 4).some((x) => x[0] === "§" || /^\d/.test(x));
      if (looksName) { out.push(cur); cur = fresh(); cur.words.push(k); } else cur.note.push(k);
    } else { if (!cur) cur = fresh(); cur.words.push(k); }
  }
  if (has(cur)) out.push(cur);
  const names = knownNames();
  return out.map((c) => {
    const spoken = c.words.join(" ");
    const name = (spoken && matchName(spoken, names)) || (spoken ? cap(spoken) : hint) || "Übung";
    const plan = planExercise(name);
    const nSets = c.scheme ? c.scheme.sets : (plan && plan.sets) || c.kg.length || 1;
    const defReps = c.scheme ? c.scheme.reps : (plan && /^\d+$/.test(String(plan.reps)) ? +plan.reps : null);
    let kg = c.kg.slice();
    const single = !c.scheme && kg.length === 1 ? { kg: kg[0], reps: c.reps[0] ?? defReps } : null;
    if (kg.length === 1 && nSets > 1) kg = Array(nSets).fill(kg[0]);
    if (!kg.length) kg = Array(nSets).fill(null);
    return {
      exercise: name,
      scheme: c.scheme ? `${c.scheme.sets}×${c.scheme.reps}` : (plan ? schemeOf(plan) : ""),
      sets: kg.map((v, idx) => ({ kg: v, reps: c.reps[idx] ?? defReps })),
      single,
      note: c.note.join(" "),
    };
  });
}
async function claudeParse(text, hint) {
  const cs = currentSession();
  const day = dayById(cs.dayId);
  const planLines = planDays().map((d) => `${d.name}: ${d.exercises.map((e) => `${e.name} (${schemeOf(e) || "ohne Schema"})`).join("; ")}`).join("\n") || "(kein Plan)";
  const doneLines = ((cs.data && cs.data.entries) || []).map((e) => `- ${e.exercise} ${e.scheme || ""}: ${e.sets.map((s) => `${s.kg ?? "ohne Gewicht"} kg × ${s.reps ?? "?"}`).join(", ")}`).join("\n");
  const prompt = `Du wandelst eine gesprochene Notiz aus dem Krafttraining in JSON um. Die Notiz kommt aus einer Spracherkennung und kann Wörter falsch trennen oder verhören.

Trainingsplan:
${planLines}
${day ? `Heute ist ${day.name} dran.\n` : ""}${hint ? `Wird keine Übung genannt, gehört alles zu: "${hint}".\n` : ""}
Heute schon eingetragen:
${doneLines || "(noch nichts)"}

Regeln:
- Ordne gesprochene Namen der passenden Übung aus dem Plan oder von heute zu und übernimm deren Schreibweise ("Langhantel rudern" = "Langhantelrudern"). Unbekannte Übungen schreibst du sauber aus.
- "3x5", "3 mal 5", "drei mal fünf", "3 Sätze à 5" heißt 3 Sätze mit je 5 Wiederholungen.
- Jeder Satz hat kg (Zahl; "82,5" oder "82 einhalb" = 82.5; ohne Zusatzgewicht null) und reps (Zahl). Fehlen die Wiederholungen eines Satzes, nimm sie aus dem genannten Schema, sonst aus dem Plan.
- "alle Sätze 80 Kilo" heißt: jeder Satz 80. Wird für eine Übung, die heute noch nicht eingetragen ist, nur ein Gewicht genannt, gilt es für alle Sätze laut Schema oder Plan.
- Korrigiert oder ergänzt die Notiz eine heute schon eingetragene Übung ("beim Rudern war der dritte Satz 86", "noch ein Satz Bankdrücken mit 65"), gib für diese Übung die vollständige neue Satzliste zurück.
- Soll eine Übung gestrichen werden ("streich Bankdrücken"), gib {"exercise":"Bankdrücken","delete":true}.
- Weitere Bemerkungen (z. B. "ging leicht", "Rücken gezwickt") kurz in note, sonst "".
- scheme ist das genannte Schema als "3x5", sonst das aus dem Plan, sonst "".

Antworte nur mit JSON in genau dieser Form:
{"entries":[{"exercise":"Langhantelrudern","scheme":"3x5","sets":[{"kg":80,"reps":5},{"kg":82,"reps":5},{"kg":84,"reps":5}],"note":""}]}

Notiz:
"""${text}"""`;
  const out = await S.sample.json(prompt, { modelTier: "quick" });
  const arr = out && Array.isArray(out.entries) ? out.entries : null;
  if (!arr) throw { code: "invalid_json" };
  const names = knownNames();
  return arr.map((e) => {
    const raw = String((e && e.exercise) || hint || "Übung").trim();
    const name = matchName(raw, names) || cap(raw);
    if (e && e.delete) return { exercise: name, delete: true };
    const sets = (Array.isArray(e.sets) ? e.sets : []).map((s) => ({
      kg: s && s.kg != null && isFinite(+s.kg) ? +s.kg : null,
      reps: s && s.reps != null && isFinite(+s.reps) ? Math.round(+s.reps) : null,
    })).slice(0, 20);
    return { exercise: name, scheme: String(e.scheme || "").replace(/^(\d+)\s*[x×]\s*/i, "$1×"), sets, note: String(e.note || "").slice(0, 200) };
  }).filter((e) => e.delete || e.sets.length);
}

async function handleSessionNote(text) {
  text = String(text || "").trim(); if (!text) return;
  if (S.noWrite) { toast("Eintragen kann nur, wem das Satzbuch gehört."); return; }
  const hint = nextUp();
  S.rec.busy = true; S.rec.final = text; render();
  let entries = null;
  try {
    if (S.sample && !S.sampleOff) {
      try { entries = await claudeParse(text, hint); }
      catch (e) { if (e && HIDE_SAMPLE.includes(e.code)) S.sampleOff = true; entries = null; }
    }
    if (!entries || !entries.length) entries = localParse(text, hint);
  } finally { S.rec.busy = false; }
  if (!entries.length) { S.rec.final = ""; render(); toast("Ich habe keine Sätze herausgehört. Sag zum Beispiel „Bankdrücken 3x5, 60, 62, 64 Kilo“."); return; }
  await applyEntries(entries, text);
}

async function applyEntries(entries, said) {
  const cs = currentSession();
  let dayId = cs.dayId;
  if (!S.dayId && (!cs.data || !(cs.data.entries || []).length)) {
    const first = entries.find((e) => !e.delete);
    const d = first && dayOfExercise(first.exercise);
    if (d) dayId = d.id;
  }
  const prevBody = clone(cs.data);
  const now = new Date().toISOString();
  const body = clone(cs.data) || { date: cs.id, entries: [], createdAt: now };
  body.dayId = dayId || ""; body.dayName = dayId && dayById(dayId) ? dayById(dayId).name : "";
  const done = [];
  for (const e of entries) {
    const n = norm(e.exercise);
    const i = body.entries.findIndex((x) => norm(x.exercise) === n);
    if (e.delete) { if (i >= 0) { body.entries.splice(i, 1); done.push(`${e.exercise} gestrichen`); } continue; }
    if (i >= 0 && e.single) {
      const old = body.entries[i];
      old.sets = old.sets.concat([e.single]); old.said = [old.said, said].filter(Boolean).join(" · "); old.at = now;
      done.push(`${old.exercise}, Satz ${old.sets.length}`);
    } else if (i >= 0) {
      body.entries[i] = { ...body.entries[i], scheme: e.scheme || body.entries[i].scheme, sets: e.sets, note: e.note || body.entries[i].note || "", said, at: now };
      done.push(`${e.exercise} geändert`);
    } else {
      body.entries.push({ id: uid(), exercise: e.exercise, scheme: e.scheme || "", sets: e.sets, note: e.note || "", said, at: now });
      done.push(e.exercise);
    }
  }
  body.updatedAt = now;
  S.picked = null; S.rec.final = ""; S.rec.partial = "";
  if (!done.length) { render(); toast("Dazu gab es heute nichts zu ändern."); return; }
  try {
    await putSession(cs.id, body.entries.length ? body : null);
    toast(`Notiert: ${done.join(", ")}`, () => putSession(cs.id, prevBody).then(() => toast("Rückgängig gemacht.")).catch(() => {}));
  } catch (_) { /* Hinweis kommt aus writeDoc */ }
}

/* ---------- Sprachnotiz auswerten: Plan ---------- */
const PSTOP = new Set("und dann mit je à a am an den die der das mein meine plan ist sind folgendes folgende außerdem danach als erstes zweites drittes übung übungen satz sätze wiederholungen wdh kommt kommen machen mache mach ich wir also okay ok ähm äh noch hier zum zur von bei".split(" "));
function localPlanSpeech(text) {
  let t = prep(text);
  t = t.replace(/(\d+)\s*sätze\s*(?:à|a|zu|mit|je|von)?\s*(\d+)/g, " §$1x$2§ ").replace(/(\d+)\s*(?:x|×|mal)\s*(\d+)/g, " §$1x$2§ ");
  t = t.replace(/\b(?:tag|einheit|training)\s+([a-z]|\d+)\b/g, (m, b) => ` ¶Tag ${b.toUpperCase()}¶ `);
  t = t.replace(/\b(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|push|pull|beine|oberkörper|unterkörper|ganzkörper)\b/g, (m) => ` ¶${cap(m)}¶ `);
  const toks = t.match(/¶[^¶]+¶|§\d+x\d+§|[a-zäöüß]+/g) || [];
  const days = []; let cur = null, words = [];
  for (const k of toks) {
    if (k[0] === "¶") { cur = { name: k.slice(1, -1), exercises: [] }; days.push(cur); words = []; continue; }
    if (k[0] === "§") {
      const [a, b] = k.slice(1, -1).split("x").map(Number);
      const name = words.join(" ").trim();
      if (name) { if (!cur) { cur = { name: "Training", exercises: [] }; days.push(cur); } cur.exercises.push({ name: cap(name), sets: a, reps: String(b), note: "" }); }
      words = []; continue;
    }
    if (!PSTOP.has(k)) words.push(k);
  }
  return days.filter((d) => d.exercises.length);
}
async function claudePlanParse(text) {
  const current = S.plan && !S.plan.example && planDays().length
    ? planDays().map((d) => `${d.name}: ${d.exercises.map((e) => `${e.name} ${schemeOf(e)}${e.note ? ` (${e.note})` : ""}`).join("; ")}`).join("\n")
    : "(noch keiner)";
  const prompt = `Du pflegst einen Trainingsplan fürs Krafttraining. Die Änderung kommt als gesprochene Notiz aus einer Spracherkennung und kann Wörter falsch trennen oder verhören.

Aktueller Plan:
${current}

Sprachnotiz:
"""${text}"""

Beschreibt die Notiz einen ganzen Plan, ersetzt er den aktuellen. Ändert sie nur etwas (Übung dazu, weg, umbenennen, Schema ändern, Reihenfolge), wende die Änderung auf den aktuellen Plan an und gib den vollständigen neuen Plan zurück.
- Gruppiere nach Trainingstagen ("Tag A", "Montag", "Push" …). Gibt es keine Tage, nimm einen Tag "Training".
- Je Übung: name (sauber geschrieben, deutsch), sets (Zahl oder null), reps (Text wie "5", "8-10", "max" oder null), note (z. B. Pause, sonst "").
- Erfinde keine Übungen und lass keine weg, die nicht entfernt werden sollen.
Antworte nur mit JSON in genau dieser Form:
{"days":[{"name":"Tag A","exercises":[{"name":"Kniebeuge","sets":3,"reps":"5","note":""}]}]}`;
  const out = await S.sample.json(prompt, { modelTier: "quick" });
  if (!out || !Array.isArray(out.days)) throw { code: "invalid_json" };
  return out.days.map((d) => ({
    name: String(d.name || "Training").slice(0, 40),
    exercises: (Array.isArray(d.exercises) ? d.exercises : []).map((e) => ({
      name: String(e.name || "").trim().slice(0, 80),
      sets: e.sets != null && isFinite(+e.sets) ? Math.round(+e.sets) : null,
      reps: e.reps != null && String(e.reps).trim() ? String(e.reps).trim().slice(0, 12) : null,
      note: String(e.note || "").slice(0, 120),
    })).filter((e) => e.name),
  })).filter((d) => d.exercises.length);
}
async function handlePlanNote(text) {
  text = String(text || "").trim(); if (!text) return;
  if (S.noWrite) { toast("Den Plan ändern kann nur, wem das Satzbuch gehört."); return; }
  S.rec.busy = true; S.rec.final = text; render();
  let days = null;
  try {
    if (S.sample && !S.sampleOff) {
      try { days = await claudePlanParse(text); }
      catch (e) { if (e && HIDE_SAMPLE.includes(e.code)) S.sampleOff = true; days = null; }
    }
    if (!days || !days.length) days = localPlanSpeech(text);
  } finally { S.rec.busy = false; S.rec.final = ""; }
  if (!days.length) { render(); toast("Ich habe keine Übungen herausgehört. Sag zum Beispiel „Tag A: Kniebeuge 3x5, Bankdrücken 3x5“."); return; }
  const used = new Set();
  for (const d of days) { let id = slug(d.name), k = 2; while (used.has(id)) id = `${slug(d.name)}-${k++}`; used.add(id); d.id = id; }
  const prev = clone(S.plan);
  const body = { days, said: text, updatedAt: new Date().toISOString() };
  try {
    await putPlan(body);
    const n = days.reduce((a, d) => a + d.exercises.length, 0);
    toast(`Plan gespeichert: ${days.length} ${days.length === 1 ? "Tag" : "Tage"}, ${n} Übungen`, () => putPlan(prev).then(() => toast("Der alte Plan ist zurück.")).catch(() => {}));
  } catch (_) {}
}

function handleNote(text) { return S.view === "plan" ? handlePlanNote(text) : handleSessionNote(text); }

function micClick() {

    if (c === "not_granted") showFallback("Das Mikrofon ist für diese Seite aus. Du kannst es im Menü des Artefakts unter Berechtigungen wieder einschalten.");

    const a = $("tab-" + v);
    if (S.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    $("v-" + v).hidden = S.view !== v;
  }
  const b = [];
  if (S.memoryOnly) b.push("Nicht gespeichert: Öffne das Satzbuch angemeldet in Claude, damit deine Notizen bleiben.");
  else if (S.noWrite) b.push("Nur lesen: Eintragen kann nur, wem das Satzbuch gehört.");
  if (S.stale) b.push("Deine Notizen sind gerade nicht erreichbar. Was du siehst, ist eventuell nicht aktuell.");
  $("banner").innerHTML = b.map((x) => `<div class="note-banner">${esc(x)}</div>`).join("");
  if (S.view === "plan") renderPlan(); else renderNotizen();
  const mic = $("mic");
  mic.classList.toggle("on", S.rec.on);
  mic.disabled = S.rec.busy;
  mic.setAttribute("aria-label", S.rec.on ? "Aufnahme beenden" : (S.view === "plan" ? "Plan einsprechen" : "Sprachnotiz aufnehmen"));
  $("mic-label").textContent = S.rec.on ? "Fertig" : S.rec.busy ? "Wird notiert …" : (S.view === "plan" ? "Plan einsprechen" : "Sprachnotiz");
  $("fb-send").disabled = S.rec.busy;
}

/* ---------- Toast ---------- */
let toastTimer = null, toastUndo = null;
function toast(msg, undo) {
  const t = $("toast");
  $("toast-text").textContent = msg;
  toastUndo = undo || null;
  $("toast-undo").hidden = !undo;
  t.style.bottom = `${$("dock").offsetHeight + 4}px`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; toastUndo = null; }, undo ? 7000 : 4500);
}
$("toast-undo").addEventListener("click", () => { const f = toastUndo; $("toast").hidden = true; toastUndo = null; if (f) f(); });

/* ---------- Ereignisse ---------- */
function route() { S.view = (location.hash || "").slice(1) === "plan" ? "plan" : "notizen"; S.picked = null; render(); }
window.addEventListener("hashchange", route);
$("v-notizen").addEventListener("click", (e) => {
  const dayb = e.target.closest("[data-day]");
  if (dayb) { S.dayId = dayb.dataset.day; S.picked = null; render(); return; }
  const st = e.target.closest("[data-strike]");
  if (st) { applyEntries([{ exercise: st.dataset.strike, delete: true }], ""); return; }
  const ln = e.target.closest("[data-ex]");
  if (ln) { const n = norm(ln.dataset.ex); S.picked = S.picked === n ? null : n; render(); }
});
$("mic").addEventListener("click", micClick);
$("fb-open").addEventListener("click", () => { $("fb-open").hidden = true; $("fb-form").hidden = false; $("fb-input").focus(); });
$("fb-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("fb-input").value.trim(); if (!v || S.rec.busy) return;
  $("fb-input").value = ""; $("fb-input").blur();
  handleNote(v);
});

/* ---------- Start ---------- */
route();

async function connect() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") { S.memoryOnly = true; S.ready.plan = S.ready.sessions = true; showFallback(); return; }

  c.use("dictation").then((d) => {
    if (!d) { showFallback(); return; }
    S.dict = d; $("mic").hidden = false; $("mic-label").hidden = false; $("fb").hidden = true;
    d.onPartial(({ text }) => { S.rec.partial = text; render(); });
    d.onFinal(({ text }) => { S.rec.final = S.rec.final ? S.rec.final + text : text.replace(/^\s+/, ""); S.rec.partial = ""; render(); });
    d.onState(({ state, reason }) => {
      if (state !== "idle") { if (!S.rec.on) { S.rec.on = true; render(); } return; }
      const was = S.rec.on; S.rec.on = false; S.rec.partial = "";
      if (reason === "not_granted") { showFallback("Das Mikrofon ist für diese Seite aus. Du kannst es im Menü des Artefakts unter Berechtigungen wieder einschalten."); return; }
      if (reason === "time_limit") toast("Die Aufnahme lief eine Stunde und wurde beendet.");
      const text = S.rec.final.trim();
      if (was && text) handleNote(text); else { S.rec.final = ""; render(); }
    });
  }).catch(() => showFallback());

  c.use("sample").then((s) => { S.sample = s || null; }).catch(() => {});
  c.use("user").then(async (u) => {
    if (!u) return;
    try { if ((await u.isOwner()) === false) { S.noWrite = true; render(); } } catch (_) {}
  }).catch(() => {});

  const db = await c.use("db").catch(() => null);
  if (!db) { S.memoryOnly = true; S.ready.plan = S.ready.sessions = true; render(); return; }
  S.db = db;
  const staleTimer = setTimeout(() => { if (!S.ready.plan || !S.ready.sessions) { S.stale = true; render(); } }, 10000);
  const settle = () => { if (S.ready.plan && S.ready.sessions) { clearTimeout(staleTimer); S.stale = false; } };
  db.doc("plan/current").onSnapshot((snap) => {
    S.plan = snap.exists ? snap.data() : null;
    if (!snap.metadata.fromCache || snap.exists) S.ready.plan = true;
    settle(); render();
  }, () => { S.ready.plan = true; settle(); render(); });
  db.collection("sessions").orderBy("date", "desc").limit(1000).onSnapshot((snap) => {
    const m = new Map(); for (const d of snap.docs) m.set(d.id, d.data());
    S.sessions = m;
    if (!snap.metadata.fromCache || snap.size) S.ready.sessions = true;
    settle(); render();
  }, () => { S.ready.sessions = true; settle(); render(); });
}
connect();
})();
</script>
