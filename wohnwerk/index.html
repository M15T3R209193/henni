<title>Wohnwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: Handy zuerst. Eine Spalte, unten die Leiste Räume · Ideen · Einkauf. Die Fotoansicht ist eine eigene Seite,
   Fragen, Rechner und Auswahl kommen als Blatt von unten. Ab Tablet bleibt alles mittig in 760px. Akzent: Tannengrün wie
   eine Wandfarbe, dazu Maßband-Gelb für Markierungen und Fortschritt. */
:root {
  --bg: #edf0ed;
  --surface: #ffffff;
  --surface-2: #f3f6f4;
  --ink: #17211e;
  --ink-2: #4a5853;
  --muted: #74827d;
  --line: #d9e1dd;
  --tanne: #1c5c4f;
  --tanne-hover: #154a3f;
  --on-tanne: #ffffff;
  --tanne-tint: #dcebe6;
  --tanne-text: #1c5c4f;
  --band: #f4c430;
  --band-edge: #a77c00;
  --band-ink: #211a00;
  --tick: rgba(33, 26, 0, .6);
  --tick-soft: rgba(23, 33, 30, .32);
  --pin-ring: rgba(0, 0, 0, .55);
  --good: #1d7650; --good-tint: #dcf0e5;
  --warn: #8f5500; --warn-tint: #f9ecd3;
  --bad: #ad3631; --bad-tint: #f7dfdc;
  --scrim: rgba(12, 18, 16, .45);
  --toast-bg: #17211e; --toast-fg: #f2f6f4; --toast-act: #f4c430;
  --shadow-sm: 0 1px 2px rgba(20, 40, 34, .06), 0 4px 14px rgba(20, 40, 34, .06);
  --shadow: 0 12px 38px rgba(20, 40, 34, .18);
  --f-display: "Bricolage Grotesque", "Avenir Next", ui-sans-serif, system-ui, sans-serif;
  --f-body: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabs-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #171e1b; --surface-2: #1e2723; --ink: #e7eeea; --ink-2: #b0bdb7; --muted: #85938d; --line: #2c3632;
    --tanne: #5dc2a6; --tanne-hover: #79d1b8; --on-tanne: #06201a; --tanne-tint: #19362f; --tanne-text: #82d8bf;
    --band: #f4c430; --band-edge: #f4c430; --band-ink: #211a00; --tick: rgba(33, 26, 0, .6); --tick-soft: rgba(231, 238, 234, .28);
    --pin-ring: rgba(0, 0, 0, .55);
    --good: #66d6a0; --good-tint: #163529; --warn: #f1b75f; --warn-tint: #3a2c13; --bad: #f2908a; --bad-tint: #3c1e1c;
    --scrim: rgba(0, 0, 0, .62); --toast-bg: #e7eeea; --toast-fg: #0f1412; --toast-act: #1c5c4f;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .45); --shadow: 0 14px 44px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171e1b; --surface-2: #1e2723; --ink: #e7eeea; --ink-2: #b0bdb7; --muted: #85938d; --line: #2c3632;
  --tanne: #5dc2a6; --tanne-hover: #79d1b8; --on-tanne: #06201a; --tanne-tint: #19362f; --tanne-text: #82d8bf;
  --band: #f4c430; --band-edge: #f4c430; --band-ink: #211a00; --tick: rgba(33, 26, 0, .6); --tick-soft: rgba(231, 238, 234, .28);
  --pin-ring: rgba(0, 0, 0, .55);
  --good: #66d6a0; --good-tint: #163529; --warn: #f1b75f; --warn-tint: #3a2c13; --bad: #f2908a; --bad-tint: #3c1e1c;
  --scrim: rgba(0, 0, 0, .62); --toast-bg: #e7eeea; --toast-fg: #0f1412; --toast-act: #1c5c4f;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .45); --shadow: 0 14px 44px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--band); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.wrap {
  width: 100%; max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Kopf */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.top-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 62px; padding-block: 10px; }
.top-in.nav { grid-template-columns: auto minmax(0, 1fr) auto; }
.brand { display: inline-grid; gap: 3px; justify-self: start; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; line-height: 1; }
.tape-mini {
  display: block; height: 8px; border-radius: 1px;
  background:
    repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 30px) left bottom / 100% 6px no-repeat,
    repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 6px) left bottom / 100% 3px no-repeat,
    var(--band);
}
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: .76rem; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 11px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-mode="cloud"] i { background: var(--good); }
.sync[data-mode="local"] i, .sync[data-mode="waiting"] i { background: var(--warn); }
.back { border: 0; background: none; display: inline-flex; align-items: center; gap: 2px; color: var(--tanne-text); font-weight: 600; padding: 8px 6px 8px 0; }
.h-title { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.h-btn { border: 0; background: none; color: var(--tanne-text); font-weight: 600; padding: 8px 0 8px 6px; }

main.wrap { padding-block: 6px calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 32px); }

/* Typo */
.h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.65rem, 5.4vw, 2.15rem); line-height: 1.08; letter-spacing: -.02em; margin: 0 0 6px; text-wrap: balance; }
.h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.16rem; line-height: 1.2; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; text-wrap: balance; }
.lead { color: var(--ink-2); margin: 0; max-width: 60ch; }
.eyebrow { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.count { font-family: var(--f-body); font-size: .74rem; font-weight: 700; background: var(--tanne-tint); color: var(--tanne-text); padding: 2px 8px; border-radius: 99px; }
.muted { color: var(--muted); }

/* Knöpfe */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600;
  transition: background-color .15s, transform .1s; text-align: center; line-height: 1.2;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--tanne); border-color: var(--tanne); color: var(--on-tanne); }
.btn.primary:hover:not(:disabled) { background: var(--tanne-hover); border-color: var(--tanne-hover); }
.btn.small { min-height: 38px; padding: 0 13px; font-size: .88rem; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn.wide { width: 100%; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; }
.file { position: relative; cursor: pointer; }
.link { border: 0; background: none; color: var(--tanne-text); font-weight: 600; padding: 8px 0; }
.link.danger { color: var(--bad); }
.link:disabled { opacity: .45; }

/* Felder */
input[type="text"], input:not([type]), textarea, select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; line-height: 1.4;
}
textarea { resize: vertical; min-height: 48px; display: block; }
input::placeholder, textarea::placeholder { color: var(--muted); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--tanne); width: 20px; height: 20px; margin: 0; flex: none; }
.lbl { display: block; font-size: .84rem; font-weight: 600; color: var(--ink-2); margin: 0 0 6px; }
.note { background: var(--surface-2); color: var(--ink-2); padding: 11px 14px; border-radius: 12px; font-size: .9rem; margin: 10px 0; }
.err { background: var(--bad-tint); color: var(--bad); padding: 11px 14px; border-radius: 12px; font-size: .92rem; margin: 12px 0 0; }

/* Räume */
.add-card { display: grid; gap: 16px; padding: 18px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-sm); margin: 6px 0 26px; }
.add-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.room { margin-bottom: 26px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { padding: 0; border: 0; background: var(--surface); border-radius: 14px; overflow: hidden; text-align: left; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; min-width: 0; }
.tile img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--surface-2); }
.tile-meta { display: flex; justify-content: space-between; gap: 6px; padding: 8px 10px; font-size: .8rem; color: var(--ink-2); }
.tile-meta b { font-weight: 600; color: var(--ink); }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 10px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 14px; padding: 14px 16px; background: var(--surface); border-radius: 14px; }
.steps li::before { content: counter(s); grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; background: var(--band); color: var(--band-ink); font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; display: grid; place-items: center; }
.steps b { display: block; font-weight: 700; }
.steps span { color: var(--ink-2); font-size: .93rem; }

/* Foto */
.stage { position: relative; width: fit-content; max-width: 100%; margin: 6px auto 0; }
.photo-hit { display: block; max-width: 100%; padding: 0; margin: 0; border: 0; background: none; border-radius: 14px; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.stage img { display: block; max-width: 100%; max-height: 66vh; width: auto; height: auto; border-radius: 14px; background: var(--surface-2); pointer-events: none; box-shadow: var(--shadow-sm); }
.tap-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; background: var(--toast-bg); color: var(--toast-fg); font-size: .88rem; font-weight: 600; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow); max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.ask-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; margin: 14px 0 8px; }
.ask-bar textarea { resize: none; max-height: 140px; }
.ai-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 0 0 24px; }
.ai-chip { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.ai-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.ai-chip[data-state="ready"] i { background: var(--good); }
.ai-chip[data-state="none"] i { background: var(--warn); }
.pin {
  position: absolute; transform: translate(-50%, -50%); width: 34px; height: 34px; padding: 0; border-radius: 50%;
  border: 0; background: var(--band); color: var(--band-ink); font-weight: 800; font-size: .9rem; display: grid; place-items: center;
  box-shadow: 0 0 0 3px var(--pin-ring), 0 4px 14px var(--pin-ring);
}
.pin.draft { animation: pulse 1.5s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 3px var(--pin-ring), 0 0 0 0 rgba(244, 196, 48, .75); } 80%, 100% { box-shadow: 0 0 0 3px var(--pin-ring), 0 0 0 18px rgba(244, 196, 48, 0); } }
.stage-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 24px; }
.hint { margin: 0; display: flex; gap: 8px; align-items: center; color: var(--ink-2); font-size: .93rem; }
.spot-list { display: grid; gap: 8px; }
.spot-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; background: var(--surface); border: 0; border-radius: 14px; box-shadow: var(--shadow-sm); width: 100%; }
.pin-num { width: 30px; height: 30px; border-radius: 50%; background: var(--band); color: var(--band-ink); font-weight: 800; display: grid; place-items: center; font-size: .85rem; }
.pin-num.room { background: var(--tanne-tint); color: var(--tanne-text); }
.spot-txt { min-width: 0; }
.spot-txt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.spot-txt small { color: var(--muted); font-size: .84rem; }
.chev { color: var(--muted); }

/* Blatt */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); border: 0; padding: 0; }
.sheet {
  position: relative; width: 100%; max-width: 680px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 20px);
  overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding-top: 8px; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet:focus { outline: none; }
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 12px; }
.sheet.anim { animation: up .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(48px); opacity: .3; } }
@media (min-width: 720px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { border-radius: 22px; max-height: 88vh; padding-bottom: 22px; }
}
.sh-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 16px; }
.sh-head.plain { grid-template-columns: minmax(0, 1fr) auto; }
.sh-title { font-family: var(--f-display); font-weight: 800; font-size: 1.32rem; line-height: 1.15; margin: 0; text-wrap: balance; }
.sh-sub { margin: 2px 0 0; color: var(--ink-2); font-size: .9rem; }
.x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink-2); display: grid; place-items: center; }
.zoom { width: 72px; height: 72px; border-radius: 12px; background-color: var(--surface-2); background-repeat: no-repeat; position: relative; overflow: hidden; flex: none; }
.zoom.sm { width: 52px; height: 52px; border-radius: 10px; }
.zoom-ring { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--band); box-shadow: 0 0 0 2px var(--pin-ring); transform: translate(-50%, -50%); }
.zoom.sm .zoom-ring { width: 16px; height: 16px; border-width: 2px; }
.preview { display: block; width: 100%; max-height: 42vh; object-fit: contain; border-radius: 14px; background: var(--surface-2); margin-bottom: 16px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 8px 13px; border-radius: 99px; font-size: .9rem; font-weight: 500; line-height: 1.25; }
.chip[aria-pressed="true"] { background: var(--tanne); color: var(--on-tanne); border-color: var(--tanne); }
label.chip { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
label.chip:has(input:checked) { background: var(--tanne-tint); border-color: var(--tanne); color: var(--tanne-text); }
.ask textarea { margin-bottom: 12px; }

/* Antwort */
.q-bubble { background: var(--tanne); color: var(--on-tanne); padding: 10px 14px; border-radius: 16px 16px 4px 16px; margin: 0 0 14px auto; width: fit-content; max-width: 88%; overflow-wrap: anywhere; }
.blick { margin: 0 0 14px; }
.blick p { margin: 0; color: var(--ink-2); }
.loading { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-top: 12px; background: var(--surface); border-radius: 14px; color: var(--ink-2); font-size: .93rem; }
.loading span:nth-child(2) { flex: 1; min-width: 0; }
.tape-load {
  flex: none; display: inline-block; width: 56px; height: 12px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 7px) 0 100% / 56px 5px repeat-x, var(--band);
  animation: tape 1s linear infinite;
}
@keyframes tape { from { background-position: 0 100%; } to { background-position: 7px 100%; } }
.ideas { display: grid; gap: 12px; }
.idea { background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-sm); min-width: 0; }
.idea-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.idea h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.star { border: 0; background: transparent; width: 42px; height: 42px; margin: -9px -11px -6px 0; display: grid; place-items: center; color: var(--muted); flex: none; border-radius: 50%; }
.star .ic { width: 22px; height: 22px; }
.star.on { color: var(--band-edge); }
.star.on .ic { fill: var(--band); }
.idea-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
.pill { font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; }
.a-leicht { background: var(--good-tint); color: var(--good); }
.a-mittel { background: var(--warn-tint); color: var(--warn); }
.a-aufwendig { background: var(--bad-tint); color: var(--bad); }
.cost { font-size: .78rem; font-weight: 600; color: var(--ink-2); padding: 3px 9px; border-radius: 99px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.idea p { margin: 0 0 10px; }
.mat ul { margin: 0 0 12px; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.mat li { font-size: .85rem; padding: 4px 10px; border-radius: 8px; background: var(--surface-2); border: 1px dashed var(--line); overflow-wrap: anywhere; }
.mat .eyebrow { margin-bottom: 6px; }
.idea-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.tool-inline { margin-top: 12px; }

.chat-label { margin-top: 22px; }
.chat { display: grid; gap: 10px; }
.msg { padding: 10px 14px; border-radius: 16px; max-width: 92%; overflow-wrap: anywhere; }
.msg.user { background: var(--tanne); color: var(--on-tanne); margin-left: auto; border-bottom-right-radius: 4px; }
.msg.assistant { background: var(--surface); border-bottom-left-radius: 4px; }
.msg p { margin: 0 0 8px; }
.msg > :last-child { margin-bottom: 0; }
.msg ul, .msg ol { margin: 0 0 8px; padding-left: 20px; }
.msg li { margin-bottom: 3px; }
.thinking { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); }
.follow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-top: 16px; }
.follow textarea { resize: none; max-height: 160px; }
.send { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--tanne); color: var(--on-tanne); display: grid; place-items: center; }
.send:disabled { opacity: .45; }
.sh-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

/* Ideen */
.saved-list { display: grid; gap: 18px; margin-top: 16px; }
.saved-head { display: flex; gap: 10px; align-items: center; margin: 0 0 8px; border: 0; background: none; padding: 0; text-align: left; width: 100%; color: var(--ink-2); font-size: .88rem; min-width: 0; }
.saved-head span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved-head b { color: var(--ink); font-weight: 600; }
.empty { background: var(--surface); border-radius: 16px; padding: 18px; color: var(--ink-2); margin-top: 14px; }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 1.08rem; margin-bottom: 4px; }

/* Einkauf */

function extractObjects(t) {
  const out = [];
  let depth = 0, start = -1, inStr = false, escp = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inStr) { if (escp) escp = false; else if (c === '\\') escp = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') { if (depth > 0) inStr = true; continue; }
    if (c === '{') { if (depth === 0) start = i; depth++; }
    else if (c === '}' && depth > 0) {
      depth--;
      if (depth === 0 && start >= 0) {
        try { const o = JSON.parse(t.slice(start, i + 1)); if (o && typeof o === 'object' && !Array.isArray(o)) out.push(o); } catch (e) { /* unvollständig */ }
        start = -1;

    }
  }
  return out;
}

    case 'session_expired': return 'Du bist abgemeldet. Melde dich in Claude neu an und frag dann noch mal.';
    case 'images_unavailable': AI.images = null; return 'Fotos kann die KI hier nicht sehen. Frag noch mal, dann antwortet sie nur nach deiner Beschreibung.';

async function aiImages(p, s) {
  const max = AI.images ? AI.images.maxCount || 1 : 0;
  if (!max) return [];
  const build = img => {
    const W = img.naturalWidth, H = img.naturalHeight;
    const k = Math.min(1, 1400 / Math.max(W, H));
    const w = Math.round(W * k), h = Math.round(H * k);
    const c = canvas(w, h); const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
    const jobs = [];
    if (s.x != null) {
      const cx = s.x * w, cy = s.y * h, r = Math.max(16, Math.min(w, h) * .07);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.lineWidth = r * .34; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.stroke();
      ctx.lineWidth = r * .18; ctx.strokeStyle = '#FFD21F'; ctx.stroke();
    }
    jobs.push(toBlob(c, .85));
    if (s.x != null && max >= 2) {
      const side = Math.min(W, H) * .45;
      const sx = Math.min(Math.max(s.x * W - side / 2, 0), W - side);
      const sy = Math.min(Math.max(s.y * H - side / 2, 0), H - side);
      const o = Math.round(Math.min(side, 900));
      const c2 = canvas(o, o); c2.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, o, o);
      jobs.push(toBlob(c2, .88));
    }
    return Promise.all(jobs);
  };
  try { return await build(await loadImg(await fullSrc(p))); }
  catch (e) { if (p.thumb) return build(await loadImg(p.thumb)); throw e; }
}
async function askIdeas(p, s, frage) {
  if (AI.state !== 'ready' || UI.ai) return;
  const kept = s.ideas.filter(i => i.saved);
  s.frage = String(frage).slice(0, 600);
  s.error = '';
  if (!p.spots.includes(s)) { p.spots.push(s); if (UI.draft === s) UI.draft = null; }
  const ctl = new AbortController();
  UI.ai = { kind: 'ideas', photoId: p.id, spotId: s.id, ctl, phase: 'prep' };
  s.ideas = kept.slice();
  renderSheet(); softRender();
  let imgs = [];
  try { imgs = await aiImages(p, s); } catch (e) { imgs = []; }
  let fresh = [], blick = s.blick;
  const apply = text => {
    const objs = extractObjects(text);
    const b = objs.find(o => typeof o.blick === 'string' && !o.titel);
    if (b) blick = b.blick.trim().slice(0, 600);
    fresh = objs.filter(o => o.titel).map(normIdea);
    s.blick = blick; s.ideas = kept.concat(fresh);

    updateSpotOut(p, s);

  try {
    if (ctl.signal.aborted) throw { code: 'cancelled' };
    UI.ai.phase = 'think'; updateSpotOut(p, s);
    const opts = { signal: ctl.signal, cache: false, onText: ({ text }) => apply(text) };
    if (imgs.length) opts.images = imgs;
    const res = await AI.fn(ideasPrompt(p, s, kept, imgs.length), opts);
    apply(res.text);
    if (!fresh.length) s.error = 'Die Antwort kam in einem unerwarteten Format. Tipp auf „Andere Ideen holen“.';
    else if (res.truncated) s.error = 'Die Antwort wurde abgeschnitten. Für mehr Ideen tipp auf „Andere Ideen holen“.';
  } catch (e) {
    if (e && e.code === 'refused') fresh = [];

    if (!e || e.code !== 'cancelled') s.error = aiErr(e);

    UI.ai = null;

}

/* ---------- Markdown light ---------- */
function md(t) {
  const lines = esc(t).split('\n');
  let h = '', list = '';
  const inl = s => s.replace(/^#{1,6}\s*/, '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const close = () => { if (list) { h += '</' + list + '>'; list = ''; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== 'ul') { close(); h += '<ul>'; list = 'ul'; } h += '<li>' + inl(m[1]) + '</li>'; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); h += '<ol>'; list = 'ol'; } h += '<li>' + inl(m[1]) + '</li>'; }
    else if (l.trim()) { close(); h += '<p>' + inl(l) + '</p>'; }
  }
  close();
  return h;
}

const topSheet = () => UI.stack[UI.stack.length - 1] || null;
function openSheet(entry) {
  const prev = topSheet();
  if (prev) prev.scroll = $('#sheetBody').scrollTop;
  UI.stack.push(entry);
  renderSheet(true);
}
function closeSheet(all) {
  const gone = all ? UI.stack.splice(0) : [UI.stack.pop()];
  gone.forEach(g => {
    if (!g) return;
    if (g.type === 'spot' && UI.draft && UI.draft.id === g.spotId) UI.draft = null;
    if (g.type === 'newPhoto' && !UI.saving) { if (UI.pending && UI.pending.url) URL.revokeObjectURL(UI.pending.url); UI.pending = null; }
  });
  renderSheet();
  if (UI.view === 'foto') renderFoto();
}
function renderSheet(anim) {
  const wrap = $('#sheet'), box = $('#sheetBody');
  while (UI.stack.length) {
    const top = topSheet();
    const html = SHEETS[top.type] ? SHEETS[top.type](top) : null;
    if (html != null) {
      const keep = anim ? 0 : (top.scroll != null ? top.scroll : box.scrollTop);
      top.scroll = null;
      box.innerHTML = html;
      wrap.hidden = false;
      document.body.classList.add('locked');
      if (anim) { box.classList.remove('anim'); void box.offsetWidth; box.classList.add('anim'); box.scrollTop = 0; box.focus({ preventScroll: true }); }
      else box.scrollTop = keep;
      $$('textarea', box).forEach(autosize);
      return;
    }
    UI.stack.pop();
  }
  wrap.hidden = true;
  document.body.classList.remove('locked');
}

  return `<div class="chips">${RAEUME.map(r => `<button type="button" class="chip" data-act="pickRoom" data-r="${esc(r)}" aria-pressed="${r === cur}">${esc(r)}</button>`).join('')}</div>
    <label class="lbl" for="roomCustom">Anderer Raum</label><input id="roomCustom" type="text" placeholder="z. B. Abstellkammer" value="${custom ? esc(cur) : ''}" autocomplete="off" style="margin-bottom:16px">`;
}

/* ---------- Bodenrechner ---------- */
function freshBoden(projectId, raum) {
  const old = UI.boden || {};
  const r = raum || (proj(projectId) || {}).raum || 'Flur';
  return {
    rects: [{ l: '', b: '' }], art: old.art || 'versetzt', paket: old.paket || '2,2', preis: old.preis || '', daemm: old.daemm !== false,
    wall: '', tueren: '1', extras: old.extras || { keile: true, profil: true, set: false, folie: false },
    target: projectId || (S.listen.projects.find(pr => pr.raum === r) || {}).id || '__new', newName: 'Boden ' + r
  };
}
function calcBoden(b) {
  const rects = b.rects.filter(x => num(x.l) && num(x.b));
  const area = rects.reduce((s, x) => s + num(x.l) * num(x.b), 0);
  const v = (ARTEN.find(a => a[0] === b.art) || ARTEN[1])[2];
  const need = area * (1 + v);
  const pack = num(b.paket);
  const packs = pack && area ? Math.ceil(need / pack - 1e-9) : 0;
  const total = packs * pack;
  const preis = num(b.preis);
  const cost = preis ? total * preis : 0;
  const daemm = b.daemm && area ? Math.ceil(area * 1.05) : 0;
  const autoWall = b.rects.length === 1 && rects.length === 1 ? 2 * (num(rects[0].l) + num(rects[0].b)) : 0;
  const wall = String(b.wall).trim() ? num(b.wall) : autoWall;
  const tueren = Math.max(0, Math.round(parseFloat(String(b.tueren).replace(',', '.')) || 0));
  const leisteM = Math.max(0, wall - tueren * .9) * 1.1;
  const leistenStk = leisteM ? Math.ceil(leisteM / 2.4) : 0;
  return { area, v, need, pack, packs, total, cost, daemm, autoWall, leistenStk };
}
function bodenResult(r) {
  if (!r.area) return '<p class="muted">Gib Länge und Breite ein, dann rechnet die App mit.</p>';
  return `<div class="res-top"><span class="big">${r.packs || '–'}</span><span>${r.packs === 1 ? 'Paket' : 'Pakete'} Bodenbelag</span></div>
    <dl>
      <dt>Fläche</dt><dd>${fmtN(r.area)} m²</dd>
      <dt>Mit ${Math.round(r.v * 100)} % Verschnitt</dt><dd>${fmtN(r.need)} m²</dd>
      ${r.packs ? `<dt>Du kaufst</dt><dd>${fmtN(r.total)} m²</dd>` : ''}
      ${r.cost ? `<dt>Belag ungefähr</dt><dd>${fmtEuro(r.cost)}</dd>` : ''}
      ${r.daemm ? `<dt>Trittschalldämmung</dt><dd>${r.daemm} m²</dd>` : ''}
      ${r.leistenStk ? `<dt>Sockelleisten à 2,4 m</dt><dd>${r.leistenStk} Stück</dd>` : ''}
    </dl>`;
}
function bodenInput(t) {
  const b = UI.boden;
  if (!b) return;
  let m;
  if ((m = t.id.match(/^b([lb])-(\d+)$/))) { const x = b.rects[+m[2]]; if (x) x[m[1] === 'l' ? 'l' : 'b'] = t.value; }
  else if (t.id === 'bPaket') b.paket = t.value;
  else if (t.id === 'bPreis') b.preis = t.value;
  else if (t.id === 'bWall') b.wall = t.value;
  else if (t.id === 'bTuer') b.tueren = t.value;
  else if (t.id === 'bDaemm') b.daemm = t.checked;
  else if (t.name === 'art') b.art = t.value;
  else if (t.dataset.extra) b.extras[t.dataset.extra] = t.checked;
  else if (t.id === 'bNew') b.newName = t.value;
  else if (t.id === 'bTarget') { b.target = t.value; const n = $('#bNew'); if (n) n.hidden = t.value !== '__new'; return; }
  else return;
  const r = calcBoden(b);
  const out = $('#bodenOut'); if (out) out.innerHTML = bodenResult(r);
  const w = $('#bWall'); if (w) w.placeholder = r.autoWall ? 'auto: ' + fmtN(r.autoWall) : 'z. B. 12';
}

  pick(f) {

    if (!idea) return;
    const chosen = $$('input[name="mat"]:checked', f).map(c => idea.material[+c.value]).filter(Boolean);
    if (!chosen.length) { toast('Wähl mindestens eine Sache aus.'); return; }
    const target = (f.querySelector('input[name="proj"]:checked') || {}).value || '__new';
    const pr = target === '__new' ? newProject(($('#pickNew').value || '').trim() || p.raum + ' – ' + idea.titel, p.raum) : proj(target);
    if (!pr) return;
    chosen.forEach(t => pr.items.push(newItem(t)));
    touchListen(); closeSheet();
    toast(plural(chosen.length, 'Sache', 'Sachen') + ' auf „' + pr.name + '“', { label: 'Ansehen', run() { openProjectView(pr); } });

  newProject() {
    const inp = $('#npName');
    const name = (inp.value || '').trim();
    if (!name) { inp.focus(); return; }
    const raum = RAEUME.find(r => name.toLowerCase().includes(r.toLowerCase())) || '';
    const pr = newProject(name, raum);
    touchListen(); UI.projectId = pr.id; go('projekt');
  },
  addItem() {
    const inp = $('#addItem'), pr = proj(UI.projectId);
    if (!inp || !pr) return;
    const lines = inp.value.split(/[\n;]+/).map(x => x.trim()).filter(Boolean);
    if (!lines.length) return;
    lines.forEach(t => pr.items.push(newItem(t)));
    inp.value = '';
    touchListen(); refreshItems(pr);

  boden() {
    const b = UI.boden, r = calcBoden(b);

    const pr = b.target === '__new' ? newProject((b.newName || '').trim() || 'Boden', (b.newName || '').replace(/^Boden\s*/, '').trim()) : proj(b.target);
    if (!pr) return;
    const items = [];
    if (r.packs) items.push(`Bodenbelag: ${r.packs} ${r.packs === 1 ? 'Paket' : 'Pakete'} à ${fmtN(r.pack)} m² (${fmtN(r.total)} m²)`);
    else items.push(`Bodenbelag: ${fmtN(r.need)} m² inkl. Verschnitt`);
    if (r.daemm) items.push(`Trittschalldämmung: ${r.daemm} m²`);
    if (r.leistenStk) items.push(`Sockelleisten: ${r.leistenStk} Stück à 2,4 m`);
    EXTRAS.forEach(([k, l]) => { if (b.extras[k]) items.push(l); });
    items.forEach(t => pr.items.push(newItem(t)));
    const art = (ARTEN.find(a => a[0] === b.art) || ARTEN[1])[1];
    const line = `Bodenrechner (${fmtDate(now())}): ${fmtN(r.area)} m² Fläche, ${art.toLowerCase()} verlegt, ${Math.round(r.v * 100)} % Verschnitt → ${r.packs ? r.packs + ' Pakete à ' + fmtN(r.pack) + ' m²' : fmtN(r.need) + ' m²'}${r.cost ? ', ca. ' + fmtEuro(r.cost) : ''}.`;

    toast(plural(items.length, 'Sache', 'Sachen') + ' auf „' + pr.name + '“', { label: 'Ansehen', run() { openProjectView(pr); } });
  }
};

async function onFile(input) {

async function saveNewPhoto() {
  const f = UI.pending;
  if (!f || UI.saving) return;
  UI.saving = true; renderSheet();
  const id = newId();
  const p = normPhoto({ kind: 'foto', id, raum: (UI.roomChoice || '').trim() || 'Sonstiges', thumb: f.thumb, w: f.w, h: f.h, asset: null, local: false, spots: [], createdAt: now(), updatedAt: now() });
  blobs.set(id, f.blob);

/* ---------- Toast ---------- */

}
function hideToast() { $('#toast').hidden = true; Toast.action = null; }

function autosize(t) {
  if (!t || t.readOnly) return;
  if (!/^(followText|askText|pNotiz|roomQ)$/.test(t.id)) return;
